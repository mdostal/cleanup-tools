<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Cleanup Approvals{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 980px;
    margin: 0 auto;
    padding: 1.5rem;
    line-height: 1.4;
  }
  nav { margin-bottom: 1rem; display: flex; align-items: center; flex-wrap: wrap; }
  nav a {
    margin-right: 1.25rem;
    text-decoration: none;
    font-weight: 600;
  }
  nav form { display: inline; margin-right: 1.25rem; }
  nav form button {
    border: none;
    background: none;
    padding: 0;
    margin: 0;
    font: inherit;
    font-weight: 600;
    text-decoration: none;
    color: inherit;
  }
  h1 { margin-top: 0; }
  hr { border: none; border-top: 1px solid #8884; margin: 1rem 0 1.5rem; }

  .status-bar { display: flex; gap: 0.75rem; flex-wrap: wrap; margin: 1rem 0 1.5rem; }
  .status-tile {
    border: 1px solid #8884;
    border-radius: 8px;
    padding: 0.5rem 1rem;
    min-width: 90px;
  }
  .status-tile strong { display: block; font-size: 1.4rem; }

  .group-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1rem;
  }
  .group-card { border: 1px solid #8884; border-radius: 10px; padding: 1rem; }
  .group-card h3 { margin: 0 0 0.4rem; font-family: ui-monospace, monospace; font-size: 0.95rem; }
  .group-card .meta { color: #888; margin: 0 0 0.5rem; }

  .badge {
    display: inline-block;
    font-size: 0.72rem;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    background: #8882;
    margin: 0 0.25rem 0.25rem 0;
  }

  .entry-card {
    border: 1px solid #8884;
    border-radius: 10px;
    padding: 1rem;
    display: flex;
    gap: 1rem;
    margin-bottom: 1rem;
    align-items: flex-start;
  }
  .entry-thumb, .entry-thumb-placeholder {
    width: 96px;
    height: 96px;
    border-radius: 6px;
    flex-shrink: 0;
    background: #8881;
  }
  .entry-thumb { object-fit: cover; }
  .entry-thumb-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    color: #888;
    text-align: center;
    text-transform: uppercase;
  }
  .entry-select { margin-top: 0.25rem; }
  .entry-body { flex: 1; min-width: 0; }
  .entry-path {
    font-family: ui-monospace, monospace;
    font-size: 0.82rem;
    word-break: break-all;
    margin: 0.2rem 0;
    color: #888;
  }
  .entry-actions { margin-top: 0.6rem; }
  .entry-actions form { display: inline; margin-right: 0.5rem; }
  button {
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid #8884;
    padding: 0.35rem 0.8rem;
    background: transparent;
    font: inherit;
  }
  .flash { border: 1px solid #8884; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1rem; }
  .flash.error { border-color: #c33; color: #c33; }

  /* Source-of-entry indicator: distinguishes an AI-proposed queue entry
     from a manually-staged one (see routes.py's _is_ai_source) without
     implying any functional difference -- approve/reject/undo/bulk/
     keyboard all treat both identically. */
  .badge-ai { background: #6b5ce755; }
  .badge-manual { background: #8882; }

  .entry-card.focused {
    border-color: #3579f6;
    box-shadow: 0 0 0 2px #3579f655;
  }

  kbd {
    border: 1px solid #8886;
    border-radius: 4px;
    padding: 0.05rem 0.4rem;
    font-family: ui-monospace, monospace;
    font-size: 0.8rem;
    background: #8881;
  }
  .kbd-hint { color: #888; font-size: 0.85rem; margin-bottom: 1rem; }

  .bulk-action-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.6rem;
    border: 1px solid #8884;
    border-radius: 8px;
    padding: 0.6rem 0.9rem;
    margin-bottom: 1.25rem;
  }
  .bulk-action-bar .meta { color: #888; }
  .bulk-group-actions { margin-left: auto; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .bulk-group-item { display: inline-flex; align-items: center; gap: 0.3rem; }
  .bulk-group-item form { display: inline; }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    margin: 1.5rem 0;
  }
  .pagination-disabled { color: #8886; }
  .pagination-info { color: #888; font-size: 0.9rem; }
</style>
</head>
<body>
<nav>
  <a href="{{ url_for('ui.dashboard') }}">Dashboard</a>
  <a href="{{ url_for('ui.queue_view') }}">Review Queue</a>
  <a href="{{ url_for('ui.plan_sort') }}">Plan: Sort</a>
  <a href="{{ url_for('ui.plan_reclaim') }}">Plan: Reclaim</a>
  <form method="post" action="{{ url_for('ui.propose_ai') }}">
    <button type="submit" title="Ask the configured AI provider to bucket ambiguous ('other') files">Propose with AI</button>
  </form>
</nav>
<hr>
{% block content %}{% endblock %}
</body>
</html>
