<!doctype html>
<html lang="en" data-ui-mode="{{ ui_mode }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Cleanup Approvals{% endblock %}</title>
<script>
  // Synchronous, inline, and placed before any CSS on purpose: reads the
  // saved theme choice (if any) from localStorage and stamps it onto <html>
  // BEFORE the browser paints anything, so there's no flash of the wrong
  // theme on load or on navigation to a new page (every route re-renders
  // this whole template from scratch). The full theme-switching UI lives
  // in static/theme.js, loaded normally at the end of <body> -- this tiny
  // snippet only ever needs to run once per page load, as early as
  // possible, so it's kept inline rather than an external file.
  (function () {
    var THEMES = ["ledger", "sonar", "tide"];
    var theme = "ledger";
    try {
      var stored = window.localStorage.getItem("cleanup-tools-theme");
      if (THEMES.indexOf(stored) !== -1) {
        theme = stored;
      }
    } catch (e) {
      // localStorage unavailable (private browsing, disabled storage, ...)
      // -- fall back to the default theme for this page view.
    }
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
  /* -------------------------------------------------------------------
   * Design tokens: three runtime-switchable themes (Ledger / Sonar /
   * Tide), selected via the `data-theme` attribute on <html> (see the
   * inline script above, and static/theme.js for the settings control
   * that changes it). Ledger's values also live on bare :root so a
   * first-ever page load -- before the inline script or localStorage
   * exist at all -- still renders with an intentional, complete theme
   * rather than unstyled/default browser chrome.
   * ------------------------------------------------------------------- */
  :root, html[data-theme="ledger"] {
    color-scheme: light;

    --bg: #ece7dd;
    --surface: #f6f3ec;
    --surface-2: #efe9dc;
    --ink: #221d16;
    --ink-soft: #6b6152;
    --line: #d9d0bd;
    --line-strong: #b9ac90;
    --accent: #8a3b2b;
    --accent-soft: #f1e0da;
    --good: #3d5a45;
    --good-soft: #e2ead9;
    --pending: #a1791f;
    --pending-soft: #f3e6c9;

    --font-display: ui-serif, "Iowan Old Style", Georgia, serif;
    --font-body: -apple-system, system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --font-ui: var(--font-body);
    --tracking-display: normal;

    --radius-card: 4px;
    --radius-control: 3px;
    --shadow-card: none;
    --hr-style: dotted;
    --hr-width: 1px;
    --focus-ring: 0 0 0 2px var(--accent-soft);
  }

  html[data-theme="sonar"] {
    color-scheme: dark;

    --bg: #0b0f10;
    --surface: #12181a;
    --surface-2: #182022;
    --ink: #d8e3e0;
    --ink-soft: #7f9490;
    --line: #23302f;
    --line-strong: #314443;
    --accent: #4fd1c5;
    --accent-soft: rgba(79, 209, 197, 0.14);
    --good: #7fe08c;
    --good-soft: rgba(127, 224, 140, 0.12);
    --pending: #ff6b4a;
    --pending-soft: rgba(255, 107, 74, 0.14);

    --font-display: -apple-system, system-ui, sans-serif;
    --font-body: -apple-system, system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --font-ui: var(--font-mono);
    --tracking-display: -0.02em;

    --radius-card: 8px;
    --radius-control: 6px;
    --shadow-card: 0 0 0 1px var(--line);
    --hr-style: solid;
    --hr-width: 1px;
    --focus-ring: 0 0 0 2px var(--accent), 0 0 14px var(--accent-soft);
  }

  html[data-theme="tide"] {
    color-scheme: light;

    --bg: #f1f4f2;
    --surface: #ffffff;
    --surface-2: #f6f9f7;
    --ink: #1b2b29;
    --ink-soft: #63756f;
    --line: #dde5e1;
    --line-strong: #c7d3ce;
    --accent: #2c6e63;
    --accent-soft: #e2efe9;
    --pending: #e1694b;
    --pending-soft: #fbe6de;
    --good: #2c6e63;
    --good-soft: #e2efe9;

    --font-display: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
    --font-body: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --font-ui: var(--font-body);
    --tracking-display: normal;

    --radius-card: 18px;
    --radius-control: 12px;
    --shadow-card: 0 6px 20px rgba(27, 43, 41, 0.08);
    --hr-style: solid;
    --hr-width: 2px;
    --focus-ring: 0 0 0 3px var(--accent-soft);
  }

  /* A real type scale, shared across all three themes (only the
     font-FAMILY/tracking differs per theme -- the size/weight
     relationships between "headline," "section title," "body," and
     "meta" text stay constant). Direct answer to a design-review
     finding: text throughout the app previously sat at one or two
     registers regardless of importance, so nothing told the eye what to
     look at first. Applied to h1/h2/h3 and .meta below; call sites that
     need a number to read as a literal headline (item counts, status
     summary) use --text-headline directly, same as .branch-count. */
  :root {
    --text-headline: 1.9rem;
    --text-3xl: 1.85rem;
    --text-2xl: 1.35rem;
    --text-xl: 1.05rem;
    --text-base: 1rem;
    --text-sm: 0.88rem;
    --text-xs: 0.76rem;
  }

  * { box-sizing: border-box; }

  /* Visually hidden but still announced by screen readers -- e.g. the
     full path alongside a short_path()-shortened label where there's no
     room (or no sensible place) for a visible disclosure control. */
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    max-width: 980px;
    margin: 0 auto;
    padding: 1.5rem;
    line-height: 1.4;
  }
  a { color: var(--accent); }
  nav { margin-bottom: 1rem; display: flex; align-items: center; flex-wrap: wrap; }
  nav a {
    margin-right: 1.25rem;
    text-decoration: none;
    font-weight: 600;
    font-family: var(--font-ui);
    color: var(--accent);
  }
  /* Current-page indicator: only ever applied to Dashboard/Review Queue
     (see base.html's nav below) -- those are the only two links that are
     actual pages you can "be on". The Plan: links are one-shot actions
     that redirect back to the dashboard, not destinations, so they never
     carry .nav-link/aria-current and never show a stuck active state. */
  nav a.nav-link {
    padding: 0.3rem 0.75rem;
    border-radius: 999px;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  nav a.nav-link:hover { background: var(--surface-2); }
  nav a.nav-link[aria-current="page"] {
    background: var(--accent-soft);
    color: var(--accent);
    box-shadow: var(--shadow-card);
  }
  nav a.nav-link[aria-current="page"]:hover { background: var(--accent-soft); }
  nav form { display: inline; margin-right: 1.25rem; }
  nav form button {
    border: none;
    background: none;
    padding: 0;
    margin: 0;
    font: inherit;
    font-family: var(--font-ui);
    font-weight: 600;
    text-decoration: none;
    color: var(--ink);
  }
  h1, h2, h3 { font-family: var(--font-display); letter-spacing: var(--tracking-display); margin-top: 0; }
  h1 { font-size: var(--text-3xl); font-weight: 800; }
  h2 { font-size: var(--text-2xl); font-weight: 700; }
  h3 { font-size: var(--text-xl); font-weight: 700; }
  /* Global .meta base: every scoped .meta rule elsewhere in this file
     only overrides color/margin, never size -- so "this is secondary,
     supporting text" reads consistently the same size everywhere it
     appears, from the kickoff bar's helper copy to a bucket row's
     "N MB" suffix. */
  .meta { font-size: var(--text-sm); }
  /* Subordinate detail appended to an h1/h2 (e.g. "(42 pending)") --
     explicitly smaller and lighter than its heading, not just
     un-bolded at the same size, so it reads as supporting information
     rather than a second headline competing with the first. */
  .heading-detail { font-size: var(--text-sm); font-weight: 400; color: var(--ink-soft); }
  hr { border: none; border-top: var(--hr-width) var(--hr-style) var(--line-strong); margin: 1rem 0 1.5rem; }

  .theme-switcher {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.82rem;
    font-family: var(--font-ui);
    color: var(--ink-soft);
  }
  .theme-switcher select {
    font: inherit;
    font-family: var(--font-ui);
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-control);
    padding: 0.25rem 0.5rem;
  }

  /* Headline stat row: "N pending · M approved · ..." -- prominent by
     design, since at real scale (thousands of entries) this is the one
     place that communicates both total scale and triage progress at a
     glance. Each status gets a colored count (see .status-summary-pending
     etc.) drawn from the same theme tokens as badge-status-* below, so the
     two stay visually consistent with each other. */
  .status-summary {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    column-gap: 2rem;
    row-gap: 0.5rem;
    margin: 1rem 0 1.5rem;
    padding: 1.1rem 1.4rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
  }
  .status-summary-item {
    display: inline-flex;
    align-items: baseline;
    gap: 0.4rem;
    font-family: var(--font-ui);
    font-size: 1rem;
    color: var(--ink-soft);
  }
  .status-summary-item strong {
    font-family: var(--font-mono);
    font-size: var(--text-headline);
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
  }
  .status-summary-pending strong { color: var(--pending); }
  .status-summary-approved strong { color: var(--good); }
  .status-summary-rejected strong { color: var(--ink-soft); }

  .dashboard-chart {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    margin: 1rem 0 1.5rem;
    padding: 1rem 1.25rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
  }
  .dashboard-chart canvas { flex-shrink: 0; }
  .dashboard-chart-legend {
    font-family: var(--font-ui);
    font-size: 0.85rem;
    color: var(--ink-soft);
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    min-width: 0;
  }
  .dashboard-chart-legend div { display: flex; align-items: center; gap: 0.4rem; }
  .dashboard-chart-legend .swatch {
    display: inline-block;
    width: 0.7rem;
    height: 0.7rem;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .dashboard-chart-legend .label {
    font-family: var(--font-mono);
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .group-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1rem;
  }
  .group-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 1rem;
  }
  .group-card h3 { margin: 0 0 0.4rem; font-family: var(--font-mono); font-size: 0.95rem; color: var(--ink); }
  .group-card .meta { color: var(--ink-soft); margin: 0 0 0.5rem; }

  /* Dashboard's collapsible location -> bucket tree (see
     _group_entries_hierarchical). One .location-branch <details> per
     configured location, each holding a .bucket-row per bucket -- kept
     visually distinct from .group-card (the flat legacy grouping still
     used for the chart) via a left accent rail instead of a full card
     border, so the tree reads as a nested hierarchy rather than a second
     grid of cards. */
  .location-tree {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .location-branch {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 0.85rem 1.1rem;
  }
  .location-branch summary {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    cursor: pointer;
    font-family: var(--font-ui);
    list-style: revert;
  }
  .location-branch-title {
    font-family: var(--font-mono);
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--ink);
  }
  /* Item counts promoted to headline numbers -- direct answer to the
     design-review finding that every fact on the dashboard read at the
     same visual weight regardless of importance. A count is the thing a
     user scans for first when triaging a branch/bucket, so it's now the
     biggest thing in the row, not folded into the same .meta text as
     "MB" and punctuation. */
  .branch-count {
    font-family: var(--font-mono);
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--accent);
  }
  .branch-count-sm { font-size: 1.05rem; }
  .full-path-hint {
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin: 0 0 0.6rem;
  }
  .full-path-hint code { font-family: var(--font-mono); word-break: break-all; }
  .bucket-list {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    margin-top: 0.75rem;
    padding-left: 1.2rem;
    border-left: 1px solid var(--line);
  }
  .bucket-row {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    padding: 0.6rem 0.85rem;
  }
  .bucket-row-header {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .bucket-label { font-family: var(--font-mono); font-size: 0.88rem; color: var(--ink); }
  .bucket-row-badges { margin-top: 0.35rem; }
  .bucket-row-actions {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.5rem;
  }
  .bucket-row-actions button {
    font-size: 0.78rem;
    padding: 0.3rem 0.7rem;
  }

  /* Settings > App icon: a selectable card per bundled icon choice,
     reusing .group-grid's layout. A thicker border (rather than a new
     color token) marks the hovered/selectable affordance so this still
     reads correctly across all three themes without new tokens. */
  .icon-choice-card {
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 1rem;
    cursor: pointer;
    text-align: center;
    font: inherit;
    font-family: var(--font-ui);
    color: var(--ink);
    width: 100%;
  }
  .icon-choice-card:hover { border-color: var(--accent); }
  .icon-choice-card.selected { border-color: var(--accent); background: var(--accent-soft); }
  .icon-choice-card img { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 0.5rem; }
  .icon-choice-card h3 { margin: 0; font-family: var(--font-mono); font-size: 0.9rem; }
  .icon-choice-current {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--accent);
    margin-top: 0.4rem;
  }

  /* Settings shell: Raycast/Obsidian-style sidebar of sections (see
     settings.html + static/settings-shell.js). All panes render
     server-side in one response; the JS only toggles .settings-pane
     visibility, so this is pure layout CSS, no JS-driven classes beyond
     .active on the current sidebar link. */
  .settings-shell {
    display: flex;
    gap: 1.5rem;
    align-items: flex-start;
  }
  .settings-sidebar {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    flex-shrink: 0;
    width: 180px;
    position: sticky;
    top: 1rem;
  }
  .settings-sidebar a {
    display: block;
    padding: 0.45rem 0.7rem;
    border-radius: var(--radius-card);
    color: var(--ink-soft);
    text-decoration: none;
    font-family: var(--font-ui);
    font-size: 0.9rem;
  }
  .settings-sidebar a:hover { background: var(--surface-2); color: var(--ink); }
  .settings-sidebar a.active {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .settings-panes { flex: 1; min-width: 0; }
  .settings-pane h2 { margin-top: 0; }
  .settings-table {
    width: 100%;
    border-collapse: collapse;
    margin: 0.75rem 0;
  }
  .settings-table th, .settings-table td {
    text-align: left;
    padding: 0.4rem 0.6rem;
    border-bottom: 1px solid var(--line);
    font-size: 0.88rem;
  }
  .settings-table th { color: var(--ink-soft); font-weight: 600; font-size: 0.78rem; }
  .settings-table input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    font-family: var(--font-mono);
    font-size: 0.85rem;
  }
  .settings-table-readonly td { color: var(--ink-soft); font-family: var(--font-mono); }
  .settings-list { list-style: none; margin: 0.5rem 0; padding: 0; display: flex; flex-direction: column; gap: 0.4rem; }
  .settings-list li {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    padding: 0.5rem 0.75rem;
  }
  .settings-list code { font-size: 0.85rem; word-break: break-all; }
  .settings-json {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    padding: 1rem;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    line-height: 1.5;
    color: var(--ink);
  }
  .settings-add-form {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 0.75rem;
  }

  /* Bare gear-icon Settings nav link (Option A) -- no label/pill, kept
     visually distinct from the Dashboard/Review Queue text links via
     padding/vertical-align rather than a second color token. */
  .nav-link-icon {
    display: inline-flex;
    align-items: center;
    padding: 0.4rem !important;
  }
  /* Pushes this nav item (and everything after it, e.g. the theme
     switcher) to the far right of the bar -- flexbox auto-margin, not a
     fixed width, so it still collapses sensibly on narrow viewports. */
  .nav-trailing { margin-left: auto; }

  /* Chip/pill styling for every .badge -- real padding, a bit of
     font-weight and letter-spacing, and a background/foreground color pair
     drawn from the active theme's tokens (see badge-ai/badge-manual and
     badge-status-* below), rather than one flat neutral color for
     everything. */
  .badge {
    display: inline-flex;
    align-items: center;
    font-family: var(--font-ui);
    font-size: 0.74rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1.3;
    padding: 0.2rem 0.65rem;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    margin: 0 0.25rem 0.25rem 0;
  }

  .entry-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 1rem;
    display: flex;
    gap: 1rem;
    margin-bottom: 1rem;
    align-items: flex-start;
  }
  .entry-thumb, .entry-thumb-placeholder {
    width: 96px;
    height: 96px;
    border-radius: var(--radius-control);
    flex-shrink: 0;
    background: var(--surface-2);
    border: 1px solid var(--line);
  }
  .entry-thumb { object-fit: cover; }
  .entry-thumb-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    text-align: center;
    text-transform: uppercase;
  }
  .entry-select { margin-top: 0.25rem; accent-color: var(--accent); }
  .entry-body { flex: 1; min-width: 0; }
  .entry-path {
    font-family: var(--font-mono);
    font-size: 0.82rem;
    word-break: break-all;
    margin: 0.2rem 0;
    color: var(--ink-soft);
  }
  .entry-actions { margin-top: 0.6rem; }
  .entry-actions form { display: inline; margin-right: 0.5rem; }
  button {
    cursor: pointer;
    border-radius: var(--radius-control);
    border: 1px solid var(--line-strong);
    padding: 0.35rem 0.8rem;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-family: var(--font-ui);
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  /* Action-intent buttons (Approve/Reject/Undo, at any scale -- a single
     entry or a whole bucket/group). Direct answer to this project's UI
     design review: two independent personas (a safety-focused archivist
     and an accessibility reviewer) separately flagged the SAME bug --
     every action button rendered as an identical thin outline pill,
     visually indistinguishable from a plain status badge or a neutral
     utility button. Three distinct risk levels now get three distinct,
     unmistakable treatments, consistent everywhere this attribute is
     used (entry cards, bucket-row actions, bulk-action bar, history
     rows) -- never per-template one-off styling. */
  button[data-intent="primary"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--surface);
    font-weight: 700;
  }
  button[data-intent="primary"]:hover { background: var(--accent); color: var(--surface); filter: brightness(1.08); }
  button[data-intent="secondary"] {
    background: transparent;
    border: 1.5px solid var(--line-strong);
    color: var(--ink);
    font-weight: 600;
  }
  button[data-intent="secondary"]:hover { border-color: var(--pending); color: var(--pending); }
  button[data-intent="ghost"] {
    background: transparent;
    border: 1.5px dashed var(--line-strong);
    color: var(--ink-soft);
  }
  button[data-intent="ghost"]:hover { border-color: var(--ink-soft); color: var(--ink); }

  /* Status: icon + text, always -- never color alone. Direct answer to
     the accessibility review finding that a bare colored pill (or worse,
     a colored dot/stripe with no text, as in the old chart legend) gives
     a screen reader or a color-blind viewer nothing to go on. The SVG
     icon is decorative (aria-hidden) because the adjacent text already
     names the status -- the icon is reinforcement, not the only signal. */
  .status-icon { display: inline-block; vertical-align: -0.15em; margin-right: 0.3rem; }

  /* Path disclosure: short_path()'s companion UI -- native <details>/
     <summary> so the full path is reachable by keyboard/focus, not only
     mouse hover (a specific, repeated ask across the design review). */
  .path-disclosure { display: inline-block; }
  .path-disclosure summary {
    cursor: pointer;
    list-style: none;
    font-family: var(--font-mono);
  }
  .path-disclosure summary::-webkit-details-marker { display: none; }
  .path-disclosure summary:hover, .path-disclosure summary:focus-visible { color: var(--accent); }
  .path-disclosure .full-path {
    display: block;
    margin-top: 0.15rem;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    color: var(--ink-soft);
    word-break: break-all;
  }

  /* Guided mode (config.ui_mode): plain-sentence entry summary + a
     collapsed-by-default technical-details disclosure (queue.html). The
     bucket icon is always paired with the sentence's own bucket-name
     text -- reinforcement, never the only signal, same principle as the
     status icons. */
  .guided-summary {
    font-size: var(--text-base);
    line-height: 1.55;
  }
  .bucket-icon { margin-right: 0.3rem; }
  .guided-tech-details summary {
    cursor: pointer;
    color: var(--ink-soft);
    font-size: var(--text-sm);
  }
  .guided-tech-details .entry-path { margin: 0.3rem 0 0; }

  /* Settings > General's interaction-mode radio picker. */
  .ui-mode-picker { display: flex; flex-direction: column; gap: 0.6rem; align-items: flex-start; }
  .ui-mode-option {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    padding: 0.65rem 0.9rem;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-card);
    cursor: pointer;
    width: 100%;
    max-width: 480px;
  }
  .ui-mode-option:has(input:checked),
  .ui-mode-option.selected { border-color: var(--accent); background: var(--accent-soft); }
  .ui-mode-option input { margin-right: 0.4rem; }
  .ui-mode-option-label { font-weight: 700; }

  .flash { border: 1px solid var(--line); border-radius: var(--radius-card); padding: 0.75rem 1rem; margin-bottom: 1rem; background: var(--surface); }
  .flash.error { border-color: var(--pending); color: var(--pending); background: var(--pending-soft); }

  .update-banner {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    border: 1px solid var(--good);
    background: var(--good-soft);
    color: var(--ink);
    border-radius: var(--radius-card);
    padding: 0.7rem 1rem;
    margin: 0 0 1rem;
    font-family: var(--font-ui);
  }
  .update-banner[hidden] { display: none; }
  .update-banner #update-banner-text { flex: 1; }
  .update-banner button {
    background: var(--surface);
  }
  .update-banner #update-banner-install {
    border-color: var(--good);
    color: var(--good);
    font-weight: 600;
  }

  /* Source-of-entry indicator: distinguishes an AI-proposed queue entry
     from a manually-staged one (see routes.py's _is_ai_source) without
     implying any functional difference -- approve/reject/undo/bulk/
     keyboard all treat both identically. */
  .badge-ai { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .badge-manual { background: var(--surface-2); border-color: var(--line); color: var(--ink-soft); }

  /* Per-status chip coloring for the dashboard's group status-count badges
     (e.g. "approved: 3") -- drawn from the same soft/solid token pairs as
     the status-summary headline above, so a status reads the same color
     everywhere it appears. Falls back to the neutral .badge styling above
     for any status this doesn't recognize. */
  .badge-status-pending { background: var(--pending-soft); border-color: var(--pending); color: var(--pending); }
  .badge-status-approved { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .badge-status-rejected { background: var(--surface-2); border-color: var(--line-strong); color: var(--ink-soft); }

  .entry-card.focused {
    border-color: var(--accent);
    box-shadow: var(--focus-ring);
  }

  kbd {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-control);
    padding: 0.05rem 0.4rem;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    background: var(--surface-2);
    color: var(--ink);
  }
  .kbd-hint { color: var(--ink-soft); font-family: var(--font-ui); font-size: 0.85rem; margin-bottom: 1rem; }

  .bulk-action-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.6rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 0.6rem 0.9rem;
    margin-bottom: 1.25rem;
  }
  .bulk-action-bar .meta { color: var(--ink-soft); font-family: var(--font-ui); }
  .bulk-group-actions { margin-left: auto; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .bulk-group-item { display: inline-flex; align-items: center; gap: 0.3rem; }
  .bulk-group-item form { display: inline; }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    margin: 1.5rem 0;
    font-family: var(--font-ui);
  }
  .pagination a { color: var(--accent); text-decoration: none; }
  .pagination-disabled { color: var(--ink-soft); opacity: 0.55; }
  .pagination-info { color: var(--ink-soft); font-size: 0.9rem; }

  /* Live status area for an async "Plan: X" trigger-link job -- see
     static/plan-trigger.js. Empty (and so invisible) until a job is
     actually in flight. Shared by all three "Plan: X" links, since only
     one such job can be in flight from a plain link click at a time. */
  .plan-status { color: var(--ink-soft); font-family: var(--font-ui); font-size: 0.9rem; }
  .plan-status-error { color: var(--pending); }

  /* Kickoff bar (dashboard.html only): launches several "Plan: X" jobs at
     once and reports each one's progress/result as its own row in
     #kickoff-panel -- see static/plan-trigger.js's initKickoffBar. */
  .kickoff-bar {
    margin: 1rem 0 1.5rem;
    padding: 1.1rem 1.4rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
  }
  .kickoff-bar h2 { margin-bottom: 0.3rem; }
  .kickoff-bar .meta { color: var(--ink-soft); margin: 0 0 0.75rem; }
  .kickoff-bar form {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .kickoff-option {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-family: var(--font-ui);
  }
  .kickoff-option input { accent-color: var(--accent); }
  /* Location subset picker, dashboard.html's optional #kickoff-form
     fieldset -- a plain unstyled <fieldset>/<legend> would look like a
     stray box; this makes it read as one grouped control alongside the
     plan-kind checkboxes rather than a separate, disconnected section. */
  .kickoff-locations {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem 1rem;
    border: 1px dashed var(--line);
    border-radius: var(--radius-card);
    padding: 0.5rem 0.9rem;
    margin: 0;
  }
  .kickoff-locations legend {
    font-family: var(--font-ui);
    font-size: 0.78rem;
    color: var(--ink-soft);
    padding: 0 0.3rem;
  }
  .kickoff-panel {
    margin-top: 0.85rem;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    font-family: var(--font-ui);
    font-size: 0.9rem;
  }
  .kickoff-row { color: var(--ink-soft); }
  .kickoff-row-done { color: var(--good); }
  .kickoff-row-error { color: var(--pending); }
  .kickoff-summary { color: var(--ink); font-weight: 600; }

  /* /history: one row per status_history record, reverse-chronological
     (see routes.py's _history_rows). Kept visually close to .entry-card
     (same background/border/radius/shadow tokens) since it's the same
     "one queue-derived thing per row" shape, just read-oriented instead
     of action-oriented. */
  .history-row {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 0.85rem 1.1rem;
    margin-bottom: 0.6rem;
  }
  .history-row-main {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .history-row-what { font-family: var(--font-ui); }
  .history-row-what code { font-size: 0.85rem; }
  .history-row-timestamp { margin-left: auto; font-family: var(--font-mono); font-size: 0.78rem; }
  .history-executed-note {
    color: var(--ink-soft);
    font-size: 0.85rem;
    font-style: italic;
    margin: 0.5rem 0 0;
  }

  /* -------------------------------------------------------------------
   * Chat page (chat.html/chat.js): a scrolling transcript of message
   * bubbles plus a fixed-height input row, matching this app's existing
   * card/surface language (var(--surface-2)/var(--accent)) rather than
   * a generic chat-widget look.
   * ------------------------------------------------------------------- */
  .chat-transcript {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    max-height: 55vh;
    overflow-y: auto;
    padding: 0.75rem;
    margin: 1rem 0;
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    background: var(--surface-1);
  }
  .chat-bubble {
    max-width: 75%;
    padding: 0.55rem 0.8rem;
    border-radius: 0.65rem;
    font-size: var(--text-sm);
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .chat-bubble-user {
    align-self: flex-end;
    background: var(--accent);
    color: var(--accent-ink, #fff);
  }
  .chat-bubble-assistant {
    align-self: flex-start;
    background: var(--surface-2);
    color: var(--ink);
  }
  .chat-bubble-error { border: 1px solid var(--danger, #b3261e); }
  .chat-form {
    display: flex;
    gap: 0.5rem;
    align-items: flex-end;
  }
  .chat-form textarea {
    flex: 1;
    resize: vertical;
    font: inherit;
    padding: 0.5rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 0.4rem;
    background: var(--surface-1);
    color: var(--ink);
  }
  .chat-status-error { color: var(--danger, #b3261e); }
  .chat-proposal-actions {
    align-self: stretch;
    max-width: 100%;
    background: var(--surface-2);
    border: 1px dashed var(--border);
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  html[data-ui-mode="console"] .chat-transcript { max-height: 65vh; padding: 0.5rem; }
  html[data-ui-mode="console"] .chat-bubble { font-size: 0.85rem; padding: 0.45rem 0.65rem; }

  /* -------------------------------------------------------------------
   * Console mode: a density/copy-style preference (config.ui_mode),
   * orthogonal to the Ledger/Sonar/Tide color theme -- see
   * config.Config.ui_mode's docstring. Built entirely as a CSS overlay
   * keyed off [data-ui-mode="console"] on <html> (see app.py's context
   * processor): every row-shaped surface (entry cards, bucket rows,
   * history rows) gets tighter padding/gaps and a monospace-forward
   * treatment for data, so triaging hundreds of entries in one sitting
   * needs less scrolling per item -- same markup, same data, no
   * separate "console" templates to keep in sync with the standard
   * ones. Per direct design-review feedback, status TEXT stays
   * sans-serif even here (all-monospace was flagged as harder to scan,
   * not easier) -- only genuinely tabular data (paths, counts, sizes)
   * goes monospace.
   * ------------------------------------------------------------------- */
  html[data-ui-mode="console"] .entry-card,
  html[data-ui-mode="console"] .bucket-row,
  html[data-ui-mode="console"] .history-row {
    padding: 0.55rem 0.75rem;
  }
  html[data-ui-mode="console"] .entry-card { gap: 0.6rem; }
  html[data-ui-mode="console"] .location-tree,
  html[data-ui-mode="console"] .bucket-list { gap: 0.35rem; }
  html[data-ui-mode="console"] .entry-path,
  html[data-ui-mode="console"] .path-disclosure summary,
  html[data-ui-mode="console"] .path-disclosure .full-path {
    font-family: var(--font-mono);
    font-size: 0.8rem;
  }
  html[data-ui-mode="console"] .entry-actions,
  html[data-ui-mode="console"] .bucket-row-actions {
    margin-top: 0.4rem;
  }
  html[data-ui-mode="console"] .entry-actions button,
  html[data-ui-mode="console"] .bucket-row-actions button,
  html[data-ui-mode="console"] .history-row button {
    padding: 0.28rem 0.6rem;
    font-size: 0.8rem;
  }
  html[data-ui-mode="console"] .branch-count { font-size: 1.1rem; }
  html[data-ui-mode="console"] .branch-count-sm { font-size: 0.95rem; }
</style>
</head>
<body>
<nav>
  <!-- "Current page" indicator: request.endpoint (Flask injects `request`
       into every template's context by default, no routes.py change
       needed) tells us which of these is the actual page being viewed.
       Only Dashboard/Review Queue/History ever get .nav-link +
       aria-current="page" -- the Plan: links below are one-shot actions
       that redirect back to the dashboard, not pages you "are on", so they
       deliberately never carry this treatment (and never show a stuck
       active state after being clicked). -->
  <a
    href="{{ url_for('ui.dashboard') }}"
    class="nav-link"
    {% if request.endpoint == 'ui.dashboard' %}aria-current="page"{% endif %}
  >Dashboard</a>
  <a
    href="{{ url_for('ui.queue_view') }}"
    class="nav-link"
    {% if request.endpoint == 'ui.queue_view' %}aria-current="page"{% endif %}
  >Review Queue</a>
  <a
    href="{{ url_for('ui.history_view') }}"
    class="nav-link"
    {% if request.endpoint == 'ui.history_view' %}aria-current="page"{% endif %}
  >History</a>
  <a
    href="{{ url_for('ui.chat_view') }}"
    class="nav-link"
    {% if request.endpoint == 'ui.chat_view' %}aria-current="page"{% endif %}
  >Chat</a>
  <a
    href="{{ url_for('ui.plan_sort') }}"
    class="plan-trigger-link"
    data-plan-kind="sort"
    data-status-url-template="{{ url_for('ui.job_status', job_id='__JOB_ID__') }}"
    data-dashboard-url="{{ url_for('ui.dashboard') }}"
  >Plan: Sort</a>
  <a
    href="{{ url_for('ui.plan_reclaim') }}"
    class="plan-trigger-link"
    data-plan-kind="reclaim"
    data-status-url-template="{{ url_for('ui.job_status', job_id='__JOB_ID__') }}"
    data-dashboard-url="{{ url_for('ui.dashboard') }}"
  >Plan: Reclaim</a>
  <a
    href="{{ url_for('ui.plan_corral_screenshots') }}"
    class="plan-trigger-link"
    data-plan-kind="corral-screenshots"
    data-status-url-template="{{ url_for('ui.job_status', job_id='__JOB_ID__') }}"
    data-dashboard-url="{{ url_for('ui.dashboard') }}"
  >Plan: Corral Screenshots</a>
  <form method="post" action="{{ url_for('ui.propose_ai') }}">
    <button type="submit" title="Ask the configured AI provider to bucket ambiguous ('other') files">Propose with AI</button>
  </form>
  <!-- Populated by static/plan-trigger.js while any "Plan: X" background job
       (see /plan/sort, /plan/reclaim, /plan/corral-screenshots,
       /status/<job_id>) is running or has just failed --
       role="status"/aria-live so screen readers announce updates without
       the page navigating away. -->
  <span id="plan-status" class="plan-status" role="status" aria-live="polite"></span>

  <!-- Trailing right-aligned group: gear icon + theme switcher, pushed to
       the far right of the bar via .nav-trailing's margin-left: auto
       (flexbox auto-margin -- pushes this element and everything after it
       to the end), so Settings reads as a persistent, separated control
       rather than another item competing with the page tabs/plan actions
       on the left. Bare gear icon, no label, no pill (Option A from the
       design-options artifact -- product-owner-confirmed). Cmd+, opens it
       from anywhere (see static/settings-shortcut.js), matching the
       macOS convention. -->
  <a
    href="{{ url_for('ui.settings') }}"
    class="nav-link nav-link-icon nav-trailing"
    id="settings-nav-link"
    title="Settings (&#8984;,)"
    aria-label="Settings"
    {% if request.endpoint == 'ui.settings' %}aria-current="page"{% endif %}
  >
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </a>

  <!-- Theme settings control -- wired up by static/theme.js, which keeps
       this <select> in sync with the active data-theme (including on
       first load) and, on change, updates data-theme + persists the
       choice to localStorage under the "cleanup-tools-theme" key. -->
  <span class="theme-switcher">
    <label for="theme-select">Theme</label>
    <select id="theme-select" aria-label="Color theme">
      <option value="ledger">Ledger</option>
      <option value="sonar">Sonar</option>
      <option value="tide">Tide</option>
    </select>
  </span>
</nav>
<hr>
<!-- Update-available banner: hidden by default, populated/shown by
     static/update-checker.js only when the desktop shell's background
     update check (src-tauri's spawn_update_check_loop) has actually found
     a newer signed release -- never shown in a plain browser tab (no
     window.__TAURI__), never shown speculatively. -->
<div id="update-banner" class="update-banner" hidden role="status" aria-live="polite">
  <span id="update-banner-text"></span>
  <button type="button" id="update-banner-install">Update now</button>
  <button type="button" id="update-banner-dismiss">Dismiss</button>
</div>
{% block content %}{% endblock %}
<script src="{{ url_for('static', filename='plan-trigger.js') }}"></script>
<script src="{{ url_for('static', filename='theme.js') }}"></script>
<script src="{{ url_for('static', filename='settings.js') }}"></script>
<script src="{{ url_for('static', filename='settings-shell.js') }}"></script>
<script src="{{ url_for('static', filename='settings-shortcut.js') }}"></script>
<script src="{{ url_for('static', filename='confirm-actions.js') }}"></script>
<script src="{{ url_for('static', filename='update-checker.js') }}"></script>
</body>
</html>
