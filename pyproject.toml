[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanup_tools"
version = "0.1.0"
description = "Cross-platform disk/downloads cleanup CLI tooling."
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
