design_decisions:
  - decision: "Overview dashboard added to this story's scope at user sign-off, not deferred"
    rationale: "User explicitly asked for a DiskDrill-style visual breakdown as part of this epic's floor, not a later polish pass — folded into the existing GET / route since it's the same queue data, just grouped/summed differently, not a new data source or layer"
  - decision: "UI never calls --from-queue directly — execution stays a separate CLI step"
    rationale: "Keeps the UI's responsibility narrow (review/decide) separate from execution (a later, deliberate CLI invocation), matching the queue's own design as a staging area, not an auto-execute pipeline"

risks:
  - severity: medium
    description: "Server accidentally reachable beyond localhost"
    mitigation: "Explicit manual lsof/netstat check in the test step, not just code review of the bind() call"
  - severity: medium
    description: "This is the layer flagged for pre-exec wireframing — interaction model could still ship unusable despite passing route tests"
    mitigation: "ui-design delegation step runs before implementation, not after; manual browser testing required, not just automated route tests"

references:
  - path: .pHive/cycle-state/ai-approvals-ui.yaml
    relevant_excerpt: |
      ui-designer lens (step 4b collaborative review) called SCALE_CALL: pre-exec — the
      approval-review interaction model needs to be wireframed before story-writing
  - path: .pHive/epics/ai-approvals-ui/docs/structured-outline.md
    relevant_excerpt: |
      Phase 3a... GET / — dashboard: overview breakdown (post-sign-off addition)... Groups
      current queue entries by group_key/bucket, computing entry count and total size per group

cross_cutting:
