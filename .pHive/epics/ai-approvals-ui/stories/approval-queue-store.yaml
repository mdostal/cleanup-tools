  - path: .pHive/epics/ai-approvals-ui/docs/structured-outline.md
    relevant_excerpt: |
      Phase 1... write_file_atomic(path, content) -> None — write to a temp file in the same
      directory, then os.replace(temp, path)... file_lock(path) context manager — fcntl.flock
      (exclusive, blocking with a timeout, e.g. 5s, raising TimeoutError)

cross_cutting:
