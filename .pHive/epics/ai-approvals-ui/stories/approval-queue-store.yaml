design_decisions:
  - decision: "Atomicity + locking live on OSAdapter, not queue.py directly"
    rationale: "Keeps the adapter as the single I/O boundary (consistent with config.py's existing pattern), and matches the prior epic's precedent of additively extending OSAdapter (list_subdirs, find_dirs, dir_size_bytes) when a real gap is found — this gap was caught during structured-outline review, not invented speculatively"
  - decision: "Approval queue is its own file, not a Config extension"
    rationale: "config.py's load_config/save_config do an unlocked, non-atomic full-file read-modify-write — safe only because exactly one process has ever touched it. This epic's whole premise (UI + CLI both touching queue state) would turn that into a lost-update race if folded into Config"

risks:
  - severity: high
    description: "Queue file corruption or lost update under concurrent UI+CLI access — the epic's foundational risk"
    mitigation: "Atomic write + file lock, with a genuine (not sequential-only) concurrency test — this is the single test in the epic that, if weak, could let a real data-integrity bug ship silently"

