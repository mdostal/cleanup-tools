    action: "README.md's Status section (README.md:26) currently lists dedupe as remaining bash-only, and the Scripts table (README.md:102) describes scripts/dedupe.sh directly. Update both once cleanup dedupe ships: note it as a real ported command, add a `cleanup dedupe [dir]` row to the Scripts table noting the full-SHA-256/structured-output behavior change vs. the old script (its hash choice and raw-pair output are both different from bash, not silent parity). Also update .pHive/CONTEXT.md's Dedupe terminology entry to describe the ported command alongside the bash original."
