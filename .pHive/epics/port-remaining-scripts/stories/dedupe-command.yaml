code_examples:
  - title: "Two-stage size-then-hash shape being ported (preserve the shape, not the hash choice)"
    file: scripts/dedupe.sh
    snippet: |
      find "$DIR" -type f ! -path '*/node_modules/*' -exec sh -c 'echo "$(stat -f%z "$1") $1"' _ {} \; 2>/dev/null \
       | sort -n | awk '{sz=$1; $1=""; f=substr($0,2); if(sz==p){print pf; print f} p=sz; pf=f}' \
       | sort -u | while read -r f; do echo "$(shasum "$f" 2>/dev/null | cut -c1-12)  $f"; done | sort | awk '{if($1==h)print ph"\n"$0; h=$1; ph=$0}'
  - title: "Existing capped-SHA-256 pattern in this codebase -- deliberately NOT reused here"
    file: src/cleanup_tools/queue.py
    snippet: |
      CONTENT_HASH_MAX_BYTES = 8 * 1024 * 1024  # 8 MiB

      def _content_hash(path: Path) -> str:
          hasher = hashlib.sha256()
          with open(path, "rb") as f:
              hasher.update(f.read(CONTENT_HASH_MAX_BYTES))
          return hasher.hexdigest()

design_decisions:
  - decision: "dedupe.py hashes the FULL, uncapped file content with SHA-256, not queue.py's existing 8-MiB-prefix-capped _content_hash helper"
    rationale: "decision 2 (task brief) / research-brief.md Risk 4 / design-discussion Open Question 2: queue.py's cap exists for a staleness check, where a false negative (missing a real change) is an acceptable narrow gap per that module's own docstring. dedupe's entire output is an identity claim ('these files are duplicates') that a user may delete files based on -- a false positive there (two same-size, same-first-8MiB, different-tail files reported as duplicates) is a materially worse failure mode. Correctness over speed, since the two-stage size pre-filter already bounds how many files ever get hashed."
  - decision: "Output is structured {hash, size_bytes, paths} groups, not bash's raw <hash> <path> line pairs"
    rationale: "research-brief.md: 'the Python port should return a structured {hash: [paths]} (or list-of-groups) shape instead, matching every other command's dict-of-JSON-serializable-data convention' -- consistent with survey.py's JSON-shaped output"
  - decision: "No dry-run/--go, no queue/UI integration for this command"
    rationale: "decision 5/6 (task brief) / design-discussion Open Question 3: dedupe never writes anything, and staging its output into the approval queue would need a third pseudo-action ('duplicate marker') with no executor -- scope creep with no consumer epic yet. CLI-only, matching find-wallets' identical scoping."

risks:
  - severity: medium
    description: "A large, duplicate-heavy Downloads folder (repeated installer re-downloads, video exports) could mean hashing a non-trivial number of large files even after the size pre-filter narrows the candidate set -- full uncapped SHA-256 on multiple large files is real wall-clock time, unlike bash's SHA-1 (faster, but the point of decision 2 is that speed isn't the priority here)"
    mitigation: "Bounded by the two-stage filter (never hashes a singleton-sized file); the test step includes a fixture-scale check confirming hashing only ever touches size-matched candidates, and this is called out explicitly as a known, accepted tradeoff (correctness over speed) rather than silently discovered later"
  - severity: low
    description: "A naive re-derivation of the size-grouping logic could accidentally hash files that don't share a size with anything else, defeating the entire point of the two-stage filter"
    mitigation: "Acceptance criteria and tests explicitly assert singleton-sized files are never hashed (not just that final output is correct), and the review step checks this ordering is enforced in code"

references:
  - path: .pHive/epics/port-remaining-scripts/docs/research-brief.md
    relevant_excerpt: |
      shasum's default is SHA-1, truncated to 12 hex characters (48 bits) here. That's a
      meaningfully higher collision risk than a full SHA-256... worth reconsidering for the port
      even though this pass stays read-only/informational... dedupe's whole output is a
      duplicate-ness claim, not an auxiliary staleness check.
  - path: .pHive/epics/port-remaining-scripts/docs/design-discussion.md
    relevant_excerpt: |
      Lean: full SHA-256, uncapped, accepting the slower worst case since it's already gated
      behind the cheap size pre-filter -- real tradeoff, needs sign-off... Dedupe hashing
      performance at scale -- bounded by the size pre-filter, but a large duplicate-heavy
      Downloads folder... could still mean hashing a non-trivial number of large files.
  - path: .pHive/CONTEXT.md
    relevant_excerpt: |
      Dedupe -- scripts/dedupe.sh: lists duplicate files by size+hash so the user can decide what
      to remove; never auto-deletes.

cross_cutting:
