id: dedupe-command
epic: port-remaining-scripts
title: Port `dedupe` as a read-only, two-stage size-then-hash duplicate finder with full SHA-256
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Implement `cleanup dedupe [dir]`, a read-only port of scripts/dedupe.sh (6 dense lines): group
  files by exact byte size (cheap pre-filter), then hash only the size-matched candidates and
  group those by hash. Two deliberate corrections vs. the bash original, both per decision 2:
  full, uncapped SHA-256 instead of bash's SHA-1 truncated to 12 hex chars (48 bits), and
  structured `{hash, size_bytes, paths}` groups instead of raw `"<hash>  <path>"` line pairs. No
  dry-run/--go concept applies -- this command never writes, moves, or deletes anything; reclaiming
  space from the duplicates it finds is explicitly out of scope for this epic.

acceptance_criteria:
  - "Given `cleanup dedupe` is run with no dir argument, when it completes, then it scans the
    platform Downloads directory by default (matching bash's `DIR=\"${1:-$HOME/Downloads}\"`), and
    `cleanup dedupe <dir>` scans an explicit directory instead."
  - "Given a fixture directory with 3 files of the same size but different content, when `dedupe`
    runs, then size-grouping considers all 3 (a 3+-member same-size group), but hash-grouping
    reports zero duplicate groups among them -- no false positive from same-size-but-different-
    content files."
  - "Given a fixture directory with 2 files of identical size AND identical content (a true
    duplicate pair), when `dedupe` runs, then they are reported together in one duplicate group
    with the correct shared hash and size."
  - "Given a fixture directory with 2 files of identical size and identical content for the first
    N bytes but differing content after byte N (for N smaller than any hash-truncation/cap a naive
    port might reuse), when `dedupe` runs, then they are NOT reported as duplicates -- proving the
    port hashes the full file content, not a prefix, unlike `queue.py`'s existing capped
    `_content_hash` helper."
  - "Given a fixture directory with only singleton-sized files (no two files share a size), when
    `dedupe` runs, then no file's content is ever read/hashed at all (verified via a hash-call
    counter or mock in the test), proving the two-stage cheap-filter-before-expensive-filter shape
    is preserved, not just the final output correctness."
  - "Given `dedupe`'s output, when inspected, then it is a structured
    `{\"dir\": ..., \"duplicate_groups\": [{\"hash\", \"size_bytes\", \"paths\": [...]}]}` shape,
    not raw unstructured `<hash> <path>` line pairs."
  - "Verify via: `pytest tests/test_dedupe.py -v` -- all tests pass."

steps:
  - id: research
    description: |
      Re-read scripts/dedupe.sh in full (all 6 lines) to confirm the exact two-stage shape: size
      grouping via `stat -f%z` (BSD/macOS-only) + sort + the adjacent-line awk trick, then hashing
      only size-matched survivors via `shasum` (SHA-1, truncated to 12 hex chars) + sort + the
      same adjacent-line awk trick. Re-read queue.py's `_content_hash`/`CONTENT_HASH_MAX_BYTES`
      (queue.py:275-293) to understand -- and deliberately NOT reuse -- its 8-MiB prefix-cap
      tradeoff (that cap exists for a staleness check, not an identity claim; see this story's
      design_decisions for why dedupe needs a different tradeoff). Re-read survey.py's read-only
      run(adapter, args=None) -> dict shape to follow.
    agent: researcher
  - id: implement
    description: |
      Create src/cleanup_tools/commands/dedupe.py: _group_by_size(adapter, target_dir) ->
      dict[int, list[Path]] via adapter.list_dir(target_dir, pattern=None) excluding
      node_modules, Path.stat().st_size per file (a cheap per-file stat, not the recursive-tree
      case dir_size_bytes exists for), keeping only size groups with 2+ members.
      _hash_file(path) -> str: full, uncapped hashlib.sha256() read over the entire file content
      (NOT queue.py's CONTENT_HASH_MAX_BYTES-capped pattern -- read the whole file regardless of
      size, per decision 2). _group_by_hash(candidates) -> dict[str, list[Path]]: hash every
      size-matched candidate only (never a singleton-size file), group by full hex digest, keep
      only groups with 2+ members. run(adapter, args=None): resolve target_dir from args.dir or
      adapter.resolve_standard_dir("downloads"), run both stages, return {"dir": ...,
      "duplicate_groups": [{"hash": h, "size_bytes": size, "paths": [...]} for each hash group]}.
      Register the dedupe subcommand in cli.py (positional `dir`, nargs="?", no --go/--from-queue)
      and add dedupe.run to COMMANDS.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Write tests/test_dedupe.py: same-size-different-content fixture produces zero duplicate
      groups (no false positive from size alone); identical-size-identical-content fixture
      produces one correct duplicate group; same-size-same-prefix-different-tail fixture produces
      zero duplicate groups (proves full-file hashing, not prefix-capped -- the acceptance
      criterion queue.py's existing approach would fail); singleton-sized files are never hashed
      at all (mock/count hashlib calls or _hash_file invocations to prove the size pre-filter
      actually gates hashing, not just that the final output happens to be correct); output shape
      matches the structured {hash, size_bytes, paths} contract, not raw pairs; a directory with
      zero duplicates returns an empty duplicate_groups list without erroring.
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Review specifically: does _group_by_hash ever run against a file whose size didn't already
      match another file's size (i.e. is the cheap-filter-before-expensive-filter ordering
      actually enforced in the code, not just true in practice for the test fixtures)? Does
      _hash_file read the full file with no size cap -- confirm there is no accidental reuse of
      queue.py's CONTENT_HASH_MAX_BYTES constant or read(N) call anywhere in this module? Is the
      SHA-1-truncated-to-48-bits behavior from bash fully gone (grep for "shasum"/"sha1" as a
      concrete check)?
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

