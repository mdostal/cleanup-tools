id: find-wallets-command
epic: port-remaining-scripts
title: Port `find-wallets` as a read-only, structurally leak-proof wallet-artifact scanner
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Implement `cleanup find-wallets [root]`, a read-only port of scripts/find-wallets.sh (17 lines):
  a filename scan (13 case-insensitive glob patterns) and a content scan (4-alternative regex over
  Documents/Desktop/Downloads, restricted to .txt/.json/.md/.rtf/.csv) for crypto-wallet artifacts.
  No dry-run/--go concept applies -- this command never writes anything, matching the bash
  script's existing safety property. The single non-negotiable requirement is that the port
  preserves the bash version's exact detection patterns (not reconstructed from memory) AND its
  never-print-matched-content guarantee -- made structural in the Python port, not just
  conventional, per the design discussion's Risk 2.

acceptance_criteria:
  - "Given `cleanup find-wallets` is run with no root argument, when it completes, then it scans
    from the user's home directory by default (matching bash's `ROOT=\"${1:-$HOME}\"`), and
    `cleanup find-wallets <root>` scans from an explicit root instead."
  - "Given a fixture tree containing files matching each of the 13 filename patterns (wallet.dat,
    *.wallet, keystore*, UTC--*, *.kdbx, electrum*, *mnemonic*, *seed*phrase*, *recovery*phrase*,
    *.keychain, default_wallet, metamask*, exodus*, atomic*wallet*) case-INsensitively, when
    `find-wallets` runs against it, then every one is reported by filename match, and files under
    node_modules/ or Library/Caches/ are excluded even if they'd otherwise match."
  - "Given a fixture tree containing files whose content matches each of the 4 content-regex
    alternatives (a 12-24-word lowercase run shaped like a BIP39 seed phrase, an `xprv[0-9A-Za-z]
    {20,}` BIP32 extended-key prefix, a `-----BEGIN ... PRIVATE KEY-----` PEM header, and an
    Ethereum keystore JSON's `\"crypto\": {...\"cipher\"` signature) inside .txt/.json/.md/.rtf/
    .csv files under Documents/Desktop/Downloads, when `find-wallets` runs, then every one is
    reported by content match with which alternative fired, and files with non-matching content
    (including near-miss strings, e.g. a 10-word run or an 8-char base58 string) are NOT reported."
  - "Given the same fixture tree, when `find-wallets`'s returned dict is inspected at every key and
    every nesting level, then no matched secret/key substring -- the seed-phrase words, the xprv
    string, the PEM key body, the keystore cipher JSON -- appears anywhere in it; only file paths
    and a match-type/pattern-identity tag (e.g. `{\"path\": ..., \"match_type\": \"content\",
    \"pattern\": \"xprv\"}`) are ever present. This must be true by construction (the scanning
    function never calls `.group()` on a content match anywhere in its code path), not merely true
    for the current fixture set."
  - "Given `cleanup find-wallets` is run against a directory it has no permission to fully read,
    when it completes, then it returns whatever it could scan rather than crashing."
  - "Verify via: `pytest tests/test_find_wallets.py -v` -- all tests pass, including the explicit
    no-leaked-secret-substring assertion above."

steps:
  - id: research
    description: |
      Re-read scripts/find-wallets.sh in full (all 17 lines) to extract the exact 13 -iname
      patterns and the exact 4-alternative content regex as literal strings -- do not
      approximate or "clean up" any of them (Risk 1: xprv[0-9A-Za-z]{20,} is a specific BIP32
      key-prefix check, not a generic base58 heuristic). Re-read survey.py's read-only,
      dict-returning shape (run(adapter, args=None) -> dict, private _helper functions, args
      accepted-and-ignored) to follow exactly. Re-read reclaim.py's _os_junk_category
      (reclaim.py:231-247) for the "loop multiple patterns per adapter.list_dir call" precedent
      the filename scan reuses.
    agent: researcher
  - id: implement
    description: |
      Create src/cleanup_tools/commands/find_wallets.py: a module-level tuple of the 13 literal
      filename patterns and the 4-alternative content regex (compiled once, as literal constants
      matching the bash source exactly). _by_filename(adapter, root): loop
      adapter.list_dir(root, pattern=p) per pattern, exclude paths containing "node_modules" or
      "Library/Caches" segments, dedupe, cap at 200 (matching bash's `head -200`). _by_content(
      adapter, root): walk Documents/Desktop/Downloads under root for the 5 allowed extensions
      (.txt/.json/.md/.rtf/.csv), excluding node_modules/.git, run re.search per alternative
      against each file's text, and on a match append ONLY {"path": ..., "match_type": "content",
      "pattern": <alternative name>} to the results -- the Match object itself must never be
      assigned to a variable that outlives the immediate `if match:` check, and .group() must
      never be called anywhere in this module (this is the load-bearing safety property; a code
      reviewer must be able to verify it by grep, not just by reading intent). Cap content-scan
      results at 100 (matching bash's `head -100`). run(adapter, args=None): resolve root from
      args.root or adapter.resolve_home(), return {"root": ..., "by_filename": [...],
      "by_content": [...]}. Register the find-wallets subcommand in cli.py (positional `root`,
      nargs="?", no --go/--from-queue) and add find_wallets.run to COMMANDS.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Write tests/test_find_wallets.py: parametrized tests asserting every one of the 13 filename
      patterns matches its literal bash-derived fixture string and does not match a deliberately
      close near-miss; parametrized tests asserting each of the 4 content-regex alternatives
      matches its literal fixture string (a real-shaped fake seed phrase, a fake xprv string, a
      fake PEM header, a fake keystore JSON) and does not match adjacent non-matching text (a
      too-short word run, a plain base58 string, etc.); an explicit test that serializes
      find_wallets.run()'s full return value (e.g. via json.dumps) and asserts none of the fixture
      files' matched secret substrings appear anywhere in that serialized output; a test that
      node_modules/Library-Caches exclusion holds for the filename scan; a test that the
      home-directory default and explicit-root argument both resolve correctly.
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Review specifically: does any code path in find_wallets.py call `.group()` or otherwise
      extract content from a content-regex Match object (grep the module for `.group` as a
      concrete check, not just a read-through)? Do the 13 filename patterns and 4 regex
      alternatives match scripts/find-wallets.sh's literal source byte-for-byte (diff them side by
      side)? Is the no-leaked-secret-substring test in test_find_wallets.py actually exercising
      real secret-shaped fixture content, not a trivial always-passing check?
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

