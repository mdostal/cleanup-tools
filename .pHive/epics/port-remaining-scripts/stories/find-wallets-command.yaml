code_examples:
  - title: "Exact filename patterns + content regex being ported (preserve literally)"
    file: scripts/find-wallets.sh
    snippet: |
      find "$ROOT" -type f 2>/dev/null \( \
        -iname 'wallet.dat' -o -iname '*.wallet' -o -iname 'keystore*' -o -iname 'UTC--*' \
        -o -iname '*.kdbx' -o -iname 'electrum*' -o -iname '*mnemonic*' -o -iname '*seed*phrase*' \
        -o -iname '*recovery*phrase*' -o -iname '*.keychain' -o -iname 'default_wallet' \
        -o -iname 'metamask*' -o -iname 'exodus*' -o -iname 'atomic*wallet*' \) \
        ! -path '*/node_modules/*' ! -path '*/Library/Caches/*' | head -200
      grep -rlIE '(\b[a-z]+ ){11,23}[a-z]+\b|xprv[0-9A-Za-z]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|"crypto"\s*:\s*\{[^}]*"cipher"' \
        "$ROOT/Documents" "$ROOT/Desktop" "$ROOT/Downloads" 2>/dev/null \
        --include='*.txt' --include='*.json' --include='*.md' --include='*.rtf' --include='*.csv' \
        --exclude-dir=node_modules --exclude-dir=.git | head -100
  - title: "Existing multi-pattern-per-adapter-call precedent to reuse for the filename scan"
    file: src/cleanup_tools/commands/reclaim.py
    snippet: |
      for root in roots:
          if not root.is_dir():
              continue
          for pattern in OS_JUNK_PATTERNS:
              candidates.extend(adapter.list_dir(root, max_depth=3, pattern=pattern))

design_decisions:
  - decision: "The content-scan function never binds a regex Match object to a variable that outlives the immediate match check, and never calls .group() anywhere in the module -- verified by the review step grepping the module, not just reading it"
    rationale: "design-discussion.md Risk 2 / research-brief.md Risk 2: the bash script's safety is structural (grep -l physically cannot emit matched content); a Python re.search port that stores or logs match.group() anywhere would silently weaken that guarantee. Making the return shape (path + pattern-identity only) the only thing the function ever constructs makes leaking impossible by construction, not just unlikely by convention."
  - decision: "The 13 filename patterns and 4 regex alternatives are ported as literal, tested constants copied directly from scripts/find-wallets.sh's source, not re-derived from a general understanding of 'wallet file names look like'"
    rationale: "research-brief.md Risk 1: xprv[0-9A-Za-z]{20,} is a specific BIP32 extended-key prefix check, not a generic base58-looking-string heuristic; a well-intentioned 'simplification' during translation risks silently narrowing or widening detection coverage"
  - decision: "No dry-run/--go, no queue/UI integration for this command"
    rationale: "decision 5 (task brief) / design-discussion Open Question 1: find-wallets never writes anything and produces no approve/reject decision -- CLI-only, matching dedupe's identical scoping"

risks:
  - severity: high
    description: "A Python re.search-based content scan could leak matched secret text if any code path stores or logs match.group() -- this is the single highest-stakes correctness property in this story, since the whole point of the command is to be safe to run against files that may contain real private keys/seed phrases"
    mitigation: "The review step explicitly greps find_wallets.py for `.group` as a concrete, mechanical check (not just intent-reading), and test_find_wallets.py asserts no fixture secret substring appears anywhere in the serialized return value"
  - severity: medium
    description: "An imprecise regex/glob port could silently narrow (false negatives) or widen (false positives) wallet detection relative to the bash original"
    mitigation: "All 13 filename patterns and 4 regex alternatives are tested against literal fixture strings mirroring bash's exact source, both positive and negative cases, per acceptance criteria"
  - severity: low
    description: "A naive Python walk + open().read() + re.search() over every matching-extension file under Documents/Desktop/Downloads could be materially slower than grep's C implementation at this project's own clutter scale"
    mitigation: "Not solved in this story's first pass -- flagged in the review step as an explicit follow-up if a real run proves slow; shelling out to grep -rlIE (mirroring dir_size_bytes's existing du shell-out precedent, adapters/base.py:213-224) is the documented fallback if needed"

references:
  - path: .pHive/epics/port-remaining-scripts/docs/research-brief.md
    relevant_excerpt: |
      Safety property, verified by close reading: the script *never* reads a match back out --
      grep -l only ever emits filenames, never the matched line/content... This exact behavior
      (never resolve a content match to its matched substring, never cat/print file contents) is
      the one non-negotiable safety property the port must preserve byte-for-byte.
  - path: .pHive/epics/port-remaining-scripts/docs/design-discussion.md
    relevant_excerpt: |
      Content-match leakage risk is structural, not conventional (Risk 2) -- re.search hands back
      a Match with .group() available; nothing stops a future edit from logging it. Mitigation:
      the scanning function returns only path + which-alternative-fired, never touches .group()
      anywhere, and a test asserts no fixture-secret substring ever appears in output.
  - path: .pHive/CONTEXT.md
    relevant_excerpt: |
      Wallet finder -- scripts/find-wallets.sh: scans for crypto-wallet artifacts by filename...
      and content signatures... Paths-only -- never prints, logs, or transmits the matched
      secret/key material.

