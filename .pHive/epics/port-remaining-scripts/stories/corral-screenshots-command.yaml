cross_cutting:
  - concern: documentation
    action: "README.md's Status section (README.md:26) currently lists corral-screenshots as remaining bash-only, the Scripts table (README.md:98) describes scripts/corral-screenshots.sh directly, and the Workflow section (README.md:110) references it as step 4. Update all three once cleanup corral-screenshots ships: note it as a real ported command, add a `cleanup corral-screenshots [dir...] [--go] [--from-queue] [--set-default-location]` row to the Scripts table calling out the exact-count fix and the --set-default-location gating explicitly (a returning reader should not assume --go alone changes their screenshot save location), and update the Workflow section's step 4 reference. Also update .pHive/CONTEXT.md's Key paths section to note the new /plan/corral-screenshots UI route alongside the existing /plan/sort and /plan/reclaim description (CONTEXT.md:49-56)."
