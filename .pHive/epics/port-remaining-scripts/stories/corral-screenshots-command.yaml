code_examples:
  - title: "Exact move behavior + screenshot-location side effect being ported"
    file: scripts/corral-screenshots.sh
    snippet: |
      mkdir -p ~/Pictures/Screenshots
      n=$(find ~/Desktop ~/Downloads ~/Documents -maxdepth 2 -iname 'screenshot*' 2>/dev/null | wc -l | tr -d ' ')
      find ~/Desktop ~/Downloads ~/Documents -maxdepth 2 -iname 'screenshot*' -exec mv -n {} ~/Pictures/Screenshots/ \; 2>/dev/null
      echo "moved ~$n screenshots -> ~/Pictures/Screenshots"
      defaults write com.apple.screencapture location ~/Pictures/Screenshots && killall SystemUIServer 2>/dev/null
  - title: "sort.py's dry-run/--go/dest_exists shape this command mirrors (NOT reclaim.py's master-path machinery)"
    file: src/cleanup_tools/commands/sort.py
    snippet: |
      if go:
          for entry in plan:
              if entry["dest_exists"]:
                  entry["moved"] = False
                  entry["error"] = "destination already exists, skipped to avoid overwrite"
                  continue
              try:
                  adapter.move(entry["src"], entry["dest"])
              except OSError as exc:
                  entry["moved"] = False
                  entry["error"] = str(exc)
              else:
                  entry["moved"] = True
                  entry["error"] = None
  - title: "reclaim.py's NotImplementedError-catch-and-skip fallback shape, reused for the screenshot-location capability"
    file: src/cleanup_tools/commands/reclaim.py
    snippet: |
      try:
          ...
          orphaned = [c for c in candidates if adapter.find_installed_app(c)]
          ...
          return {"entries": entries}, refusals
      except NotImplementedError:
          return {"skipped": True, "reason": "not supported on this OS"}, []
  - title: "reclaim.py's config-driven default-roots precedent this command reuses (decision 3)"
    file: src/cleanup_tools/commands/reclaim.py
    snippet: |
      def _resolve_roots(adapter, config, raw_dirs):
          if raw_dirs:
              return [Path(d) for d in raw_dirs]
          if config.search_roots:
              return [Path(r) for r in config.search_roots]
          return [adapter.resolve_standard_dir("documents"), adapter.resolve_standard_dir("desktop")]

design_decisions:
  - decision: "The screenshot-save-location change is gated behind its own explicit CLI flag (--set-default-location), never bundled into --go"
    rationale: "decision 1 (task brief) / research-brief.md Risk 7 / design-discussion Open Question 5: killall SystemUIServer restarts a running system process (Dock/menu-bar briefly disappear/relaunch) -- a categorically more invasive side effect than any file move/delete this tool has ever performed. Bundling it into every --go would be a bigger unannounced behavior change than any prior epic ever made; a separate flag makes the invasive act a deliberate, individually-chosen one."
  - decision: "corral_screenshots.py follows sort.py's structure, not reclaim.py's -- no master-path-refusal check is added for screenshot moves"
    rationale: "decision 7 (task brief) / research-brief.md Risk 6: reclaim.py's _master_path_refusal machinery is delete-specific and is never consulted by sort.py's move logic today either -- this is a pre-existing gap in sort, not a new one introduced by this story. Adding master-path awareness only to corral-screenshots (and not sort) would be an inconsistent, half-fix; out of scope for this epic per explicit decision."
  - decision: "Default search roots are read from Config.search_roots (already-existing field, reclaim.py's precedent), not hardcoded to Desktop/Downloads/Documents"
    rationale: "decision 3 (task brief) / design-discussion Open Question 4: reusing search_roots avoids inventing a screenshot-specific config key for what is conceptually the same 'where do I look for clutter' setting reclaim already uses -- accepting that one config edit now silently affects two commands, which is the explicitly signed-off tradeoff."
  - decision: "The moved-count is exact (per-entry moved:true/false), not bash's pre-move ~n approximation"
    rationale: "research-brief.md: because bash's n is counted before the move and mv -n can silently skip destination-collision files, the printed count is only an upper bound. sort.py's plan already has the right shape (entry['moved'] per-file) to report an exact post-move count -- reusing it here is a deliberate improvement over bash, not a behavior preserved for its own sake."
  - decision: "UI integration reuses _stage_sort_plan's exact shape and a single flat group_key='corral-screenshots' (not a per-bucket key like sort's)"
    rationale: "design-discussion §2 Story C: there is only one kind of action here (move to Pictures/Screenshots), so a per-bucket key would be over-engineering; open to revisiting if bulk-approving all N moves at once turns out too coarse in practice, but not a concern this story needs to solve preemptively"

risks:
  - severity: high
    description: "killall SystemUIServer is a new category of invasiveness for this codebase -- every existing destructive action is scoped to file moves/deletes; a wrong gate here has the most direct blast radius (a live Dock/menu-bar restart on the real machine) of anything in this epic"
    mitigation: "Gated behind its own explicit, independent flag (decision 1); the review step specifically verifies no code path triggers it without that flag; manual verification exercises it once deliberately before any unattended use (see vertical-plan.md §2 Slice C)"
  - severity: medium
    description: "corral-screenshots has no master-path awareness, because sort.py (its closest precedent) has none either -- a screenshot inside a configured, not-yet-backed-up master path would move with zero refusal check"
    mitigation: "Explicitly signed off as matching sort's existing behavior today (decision 7) -- not a new gap this epic introduces, and out of scope to fix here; a future epic hardening sort's master-path awareness would fix this command too, once it exists"
  - severity: low
    description: "Reusing search_roots for corral-screenshots' defaults means a user editing that config value for reclaim's sake now silently also changes where screenshots are found, and vice versa"
    mitigation: "Explicitly signed off (decision 3) as the accepted tradeoff vs. inventing a screenshot-specific config key; documented in the cross_cutting README/CONTEXT update below so it isn't a surprise to a returning reader"

