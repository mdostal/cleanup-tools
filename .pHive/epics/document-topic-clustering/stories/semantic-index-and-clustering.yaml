      purpose: "build_plan_snapshot/_content_hash's capped-prefix-hash-as-staleness-signal contract -- the precedent this story's cache-key hashing follows (see grill-T2's careful disambiguation in the design discussion)."
    - path: src/cleanup_tools/config.py
      purpose: "load_config/save_config/config_to_dict pattern -- semantic_cluster_threshold (added in semantic-ui-and-settings) follows this exactly; this story just needs to accept a threshold parameter, not persist it."

files_to_modify:
  - file: src/cleanup_tools/semantic/index.py
    change: New -- SQLite content-hash-keyed embedding cache.
  - file: src/cleanup_tools/semantic/cluster.py
    change: New -- threshold + union-find clustering, label/slug heuristic.

design_decisions:
  - decision: Threshold + union-find over cosine similarity, not HDBSCAN.
    rationale: "Research brief's own explicit steer ('avoid pulling in scikit-learn as a new heavy dep if it can be avoided'); personal-library scale makes brute-force O(N^2) genuinely fine per the brief's own performance ballpark. See design discussion §2.4."
  - decision: Plain stdlib sqlite3, not sqlite-vec.
    rationale: A compiled sqlite extension is more dependency/build risk than benefit at this scale (thousands, not millions, of vectors) -- brute-force in-process cosine similarity over a BLOB table is simpler and sufficient.

risks:
  - severity: low
    description: Threshold-based clustering is cruder than HDBSCAN (no density-adaptive behavior).
    mitigation: "Accepted tradeoff, explicitly stated in the design discussion §3 -- a follow-up epic can swap the clustering algorithm behind this same interface without touching anything else if real usage shows it's needed."

references:
  - path: .pHive/epics/document-topic-clustering/docs/grill-record.md
    relevant_excerpt: |
      T2: content-hash is a cache key only, never a cap on embedded text. V1: label and slug
      are related but distinct -- the slug is a deterministic filesystem-safe transform of
      the label, both must be produced together.

