  roster: [researcher, technical-writer, tpm]
  per_tag_reasoning:
    macos-native: "First PyObjC/Apple-framework dependency in the codebase -- a genuinely new platform-capability tier beyond the existing OSAdapter subprocess/xattr calls."
    local-ml: "First local embedding/clustering subsystem -- explicitly local-only (no network call anywhere in this epic), a deliberate contrast with the chat epic's network-calling AI provider."
    packaging: "PyObjC-under-PyInstaller is unverified in this project's build pipeline -- a real, load-bearing packaging risk this epic must close out with a real verification pass, not an assumption."
  confidence: medium
  gate_decisions:
    grill: ran, round 1, 4 findings resolved before user review
    collaborative_review: solo-orchestrator self-review (no separate spawned personas this run)
    dependency_footprint: "Apple-native (PyObjC) only, phase 1 -- explicit, justified decision in design-discussion.md §2.3, not a silent default."

