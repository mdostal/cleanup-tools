    - path: src/cleanup_tools/commands/reclaim.py
      purpose: "Already-working multi-root reference pattern (lines ~421-430: CLI dirs win, else search_roots, else default set)."
    - path: src/cleanup_tools/config.py
      purpose: "Config.search_roots (line 45) -- already exists, no schema change needed."
    - path: src/cleanup_tools/ui/routes.py
      purpose: "_stage_sort_plan/_stage_reclaim_plan/_stage_corral_screenshots_plan construct group_key today -- all three need the new location segment."

files_to_modify:
  - file: src/cleanup_tools/commands/sort.py
    change: Accept multiple roots via Config.search_roots, matching reclaim.py's precedence (CLI dirs win, else configured search_roots, else default).
  - file: src/cleanup_tools/ui/routes.py
    change: Embed a location segment into group_key in all three staging functions; add the defensive old-format parser.

code_examples:
  - title: Existing multi-root pattern to mirror
    file: src/cleanup_tools/commands/reclaim.py
    snippet: |
      """CLI-supplied dirs win; else configured search_roots; else Documents+Desktop."""
      if config.search_roots:
          return [Path(r) for r in config.search_roots]

design_decisions:
  - decision: Root is an open-ended value derived from actual configured/selected locations, not a fixed enum.
    rationale: Explicit product-owner correction -- "it should be able to sort ANY and all locations."
  - decision: Old-format group_keys get defensive (not migration-proven) parsing.
    rationale: The real queue will be reset before this ships, per the product owner -- de-scopes the original, much riskier backward-compatibility requirement.

risks:
  - severity: medium
    description: sort.py's single-target-dir assumption runs deeper than the public run() signature (also _plan, _run_from_queue, CLI parsing).
    mitigation: Audit all call sites during research step, not just the entry point; mirror reclaim.py's already-proven shape exactly rather than inventing a new one.

