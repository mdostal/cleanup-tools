code_examples:
  - title: "Dry-run/destructive-action pattern to preserve conceptually (adapter itself stays dry-run-agnostic)"
    file: scripts/safe-reclaim.sh
    snippet: |
      GO=""; [ "$1" = "--go" ] && GO=1
      say(){ [ -n "$GO" ] && echo "DELETING: $1" || echo "would delete: $1"; }
      find ~/Documents -type d \( -name node_modules -o -name .next \) -prune 2>/dev/null | \
        while read -r d; do say "$d"; [ -n "$GO" ] && rm -rf "$d"; done
  - title: "list_dir must replicate maxdepth-1 file walk"
    file: scripts/sort-downloads.sh
    snippet: |
      find "$DIR" -maxdepth 1 -type f ! -name '.*' | while read -r f; do
        b=$(basename "$f"); ext="${b##*.}"; ...
      done

design_decisions:
  - decision: "find_installed_app is macOS-only for v1; Arch's implementation raises NotImplementedError rather than a no-op or a best-effort guess"
    rationale: "Team review (architect lens) during H/V planning confirmed Arch's package manager already tracks installed state, so there's no 'orphaned installer file' concept to detect the same way — silently stubbing it would hide that reclaim's orphaned-installer feature is macOS-only, not cross-platform yet"
  - decision: "OS detection lives in a factory function, not in each command"
    rationale: "Keeps commands (survey/sort/reclaim, built in later stories) OS-agnostic — they call get_adapter() once and never branch on platform themselves"

risks:
  - severity: medium
    description: "Interface could be too narrow once sort/reclaim (later stories) need something not anticipated here"
    mitigation: "design-discussion.md §6 already flags this as the one genuinely open question; extend the interface additively in later stories rather than redesigning it, per vertical-plan.md §6's moldability note"

references:
  - path: docs/REQUIREMENTS.md
    relevant_excerpt: |
      Harden as a Node/TS or Python CLI (packaged, testable), config file for the ext→bucket +
      master-paths + search-roots. Optional tiny local UI later. No network, no telemetry.
  - path: .pHive/epics/harden-cleanup-cli/docs/horizontal-plan.md
    relevant_excerpt: |
      list_dir(path, max_depth, pattern) — used by survey (extension histogram, screenshot
      count, node_modules discovery), sort (maxdepth-1 file walk), reclaim (junk-file/build-cache
      discovery)... find_installed_app(installer_path)... This operation is macOS-specific in
      its current form... Arch has no direct analog.

cross_cutting:
  - concern: documentation
    action: "README.md's script table describes bash scripts directly; once this story lands, README needs a note that the package skeleton exists (even before commands are ported) so a reader isn't confused by pyproject.toml appearing with no working CLI yet. Update in the integrate step."
