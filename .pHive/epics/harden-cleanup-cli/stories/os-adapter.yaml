id: os-adapter
epic: harden-cleanup-cli
title: Build the OS-adapter interface (macOS + Arch Linux) and package skeleton
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Create the Python package skeleton (pyproject.toml + src/cleanup_tools/ layout) and the
  OS-adapter interface that survey/sort/reclaim will all depend on: file read/write, directory
  listing, move, delete, home/standard-dir resolution, disk usage, Docker-installed check, and
  macOS-only orphaned-installer app matching. Implement it for macOS and Arch Linux — no other
  platform. This is pure foundation: no CLI commands, no config loading, nothing user-facing yet.

acceptance_criteria:
  - "Given a fresh checkout, when `pip install -e .` is run, then the `cleanup_tools` package
    installs with no errors on both macOS and Arch Linux."
  - "Given the adapter's `list_dir`/`disk_usage`/`resolve_home` are called on macOS, when compared
    to `find`/`df`/`$HOME` output for the same path, then results match."
  - "Given the adapter's `list_dir`/`disk_usage`/`resolve_home` are called on Arch Linux, when
    compared to `find`/`df`/`$HOME` output for the same path, then results match (this is the
    concrete proof the interface abstracts correctly, not just on the platform it was written on)."
  - "Given `is_docker_installed()` is called, when Docker is and isn't present, then it returns
    true/false correctly on both platforms."
  - "Given `find_installed_app(installer_path)` is called on macOS, when the installer's target
    app is and isn't already in /Applications, then it returns true/false correctly."
  - "Given `find_installed_app` is called on Arch Linux, then it raises `NotImplementedError` with
    a clear message — this operation is explicitly macOS-only for v1 (per
    horizontal-plan.md §2), not silently stubbed."
  - "Verify via: `pytest tests/test_adapters.py -v` — all tests pass on the machine it's run on."

steps:
  - id: research
    description: |
      Read scripts/survey.sh, scripts/sort-downloads.sh, scripts/safe-reclaim.sh in full to
      confirm every filesystem/OS operation they call (find, df, du, mv, rm, docker). Cross-check
      against horizontal-plan.md §2's operation list before writing the interface — the operation
      list is pre-decided, but confirm nothing was missed.
    agent: researcher
  - id: implement
    description: |
      Create pyproject.toml (package name cleanup_tools, Python >=3.10, pytest as a dev
      dependency). Create src/cleanup_tools/adapters/base.py with an abstract OSAdapter class
      declaring: read_file, write_file, list_dir(path, max_depth=None, pattern=None), move,
      delete, resolve_home, resolve_standard_dir(kind), disk_usage(path), is_docker_installed(),
      find_installed_app(installer_path). Create adapters/macos.py and adapters/arch_linux.py
      implementing it. find_installed_app raises NotImplementedError on Arch (see acceptance
      criteria). Add a factory function (e.g. get_adapter()) that detects the current OS via
      `platform.system()`/`platform.freedesktop_os_release()` and returns the right
      implementation — this factory is what commands will call, not the classes directly.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Write tests/test_adapters.py covering every operation on whichever platform the tests run
      on (macOS locally, Arch Linux locally — this story doesn't need CI, per kickoff's
      confirmed absence of CI). Assert find_installed_app raises NotImplementedError on the Arch
      implementation specifically (not just "on Arch" — instantiate ArchLinuxAdapter directly and
      call it, so this assertion doesn't depend on which machine runs the test).
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Review the adapter interface against horizontal-plan.md §2's operation list for
      completeness, and confirm find_installed_app's macOS-only scoping is documented in the
      class docstring, not just in this story.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Documents/work/cleanup-tools
  tech_stack:
    language: python
    test_framework: pytest
  key_files:
