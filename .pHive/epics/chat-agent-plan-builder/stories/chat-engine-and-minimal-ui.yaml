id: chat-engine-and-minimal-ui
epic: chat-agent-plan-builder
title: Tool-calling engine + jobs.py streaming extension + minimal chat UI
status: done
complexity: high
methodology: classic
depends_on: []

description: |
  The foundation slice: extend jobs.py with a generic partial-text field so a running
  background job can publish growing text (not just numeric progress), build the
  Anthropic tool-calling loop (multi-turn, streaming, executes whichever tools the model
  calls and feeds results back until a final text response), and wire up the smallest
  possible end-to-end UI -- a /chat page with ONE trivial read-only tool (list_locations)
  -- to prove the whole pipeline works before any higher-risk pieces (the write path,
  cost caps) are built on top of it.

acceptance_criteria:
  - "Given a running background job, when its target_fn calls a new partial_callback, then GET /status/<job_id> includes that text under a `partial` key while status is still \"running\", and existing callers that never read `partial` are unaffected."
  - "Given a fresh conversation, when a user asks \"what locations are configured\", then the engine calls list_locations, feeds the real result back to the model, and the model's final answer reflects the actual configured search_roots."
  - "Given a turn in progress, when the client polls /status/<job_id>, then it sees the assistant's response text grow incrementally, not appear all at once only when the turn finishes."
  - "Given the /chat page, when it loads, then it matches this session's established visual language (nav link with .nav-link/aria-current like History, base.html's type scale, no new ad-hoc styling system)."

steps:
  - id: research
    description: |
      Confirm jobs.py's exact current JobState shape and start_job/get_job signatures
      (already read this session -- re-verify nothing drifted). Confirm anthropic SDK's
      streaming API shape (client.messages.stream(...)) and tool-use event structure for
      the target model.
    agent: researcher
  - id: implement
    description: |
      jobs.py: add JobState.partial + partial_callback, threaded through start_job/_run
      exactly like the existing progress_callback. New src/cleanup_tools/chat/state.py
      (in-memory conversation store, mirrors jobs.py's module shape). New
      src/cleanup_tools/chat/engine.py (the tool-calling loop) and
      src/cleanup_tools/chat/tools.py (starts with list_locations only). The engine's
      system prompt explicitly frames every tool result (filenames, paths, counts) as
      data to classify, never as instructions to follow -- per design discussion §2.8's
      prompt-injection posture; this is the one place that framing is established, every
      later story's tools inherit it rather than each needing their own. New routes:
      GET /chat, POST /chat/new, POST /chat/<id>/message (kicks off jobs.start_job).
      New templates/chat.html + static/chat.js (polling, incremental render). Nav link
      matching History's precedent.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      jobs.py extension: unit tests proving partial updates before completion and that
      existing progress_callback-only callers are unaffected. Engine: tests against an
      injected fake Anthropic client (mirroring AnthropicProvider's own test-injection
      pattern) proving the tool-call round-trip and streaming accumulation work.
      Route-level tests for /chat page render and the full message-post-then-poll flow.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review the jobs.py extension specifically for backward compatibility with every existing start_job caller (plan_sort/plan_reclaim/plan_corral_screenshots), and the engine's tool-loop termination logic (must always terminate, never spin on repeated tool calls).
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

context:
