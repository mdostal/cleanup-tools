code_examples:
  - title: Existing background-job pattern this story extends
    file: src/cleanup_tools/ui/jobs.py
    snippet: |
      def start_job(target_fn: Callable[..., Any], *args: Any) -> str:
          ...
          def _progress_callback(current: int, total: int) -> None:
              with _lock:
                  job = _jobs.get(job_id)
                  if job is not None:
                      job.current = current
                      job.total = total
          # this story adds an equivalent _partial_callback(text) -> job.partial = text

design_decisions:
  - decision: "Streaming is delivered via a generic jobs.py extension (partial field), not a chat-specific mechanism or Server-Sent Events."
    rationale: "This project has zero JS bundler and one already-proven async pattern; generalizing it by one field is smaller and more consistent than introducing a second transport (design discussion §2.5)."
  - decision: "Conversation state is in-memory only, mirroring jobs.py's own module-level dict + lock, never persisted."
    rationale: "Conversations are ephemeral UI state, like background jobs -- the only durable output is whatever gets staged into queue.yaml (design discussion §3)."
  - decision: "This slice ships with exactly one tool (list_locations) on purpose."
    rationale: "Prove the engine/streaming/UI pipeline end-to-end before adding the higher-risk read-heavy and write tools in later slices -- a real vertical slice, not a stub."

risks:
  - severity: high
    description: A bug in the tool-calling loop's termination condition could spin indefinitely (repeated tool calls, never reaching final text), pinning a background thread forever.
    mitigation: A hard cap on tool-call round-trips WITHIN a single turn (independent of the epic-level turn cap added in a later story), enforced in engine.py itself; explicit test for this case.
  - severity: medium
    description: Extending JobState is a shared-module change touching every existing start_job caller.
    mitigation: Explicit backward-compatibility test suite entry (existing plan_sort/plan_reclaim/plan_corral_screenshots jobs must be provably unaffected) called out in the review step.

references:
  - path: .pHive/epics/chat-agent-plan-builder/docs/design-discussion.md
    relevant_excerpt: |
      §2.5: jobs.py needs JobState.partial + partial_callback before the polling-reuse
      claim is true... "turn" = one full user-message-to-assistant-response cycle.
  - path: .pHive/epics/chat-agent-plan-builder/docs/research-brief.md
    relevant_excerpt: |
      Nothing in ai/ supports multi-turn state, streaming, or an open tool loop -- a chat
      agent is a different shape, needs new code, not a parameter tweak.

