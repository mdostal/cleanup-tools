id: pyinstaller-sidecar-build
epic: desktop-app-shell
title: Freeze the Flask UI into a per-platform PyInstaller sidecar binary, with an explicit onefile-vs-onedir spike
status: pending
complexity: high
methodology: classic
depends_on: []

description: |
  Freezes `src/cleanup_tools/ui/`'s Flask app -- and its full dependency tree (Flask, Pillow,
  PyYAML, `anthropic` and its transitive `httpx`/`pydantic` stack, all already declared in
  `pyproject.toml`'s `dependencies`) -- into a single standalone binary per target platform (macOS,
  Arch/Linux), matching the research brief's Option A recommendation: this is the dominant
  real-world pattern for exactly this Tauri+Flask shape (every real prior-art example found uses
  it, none uses Nuitka or a bundled runtime -- research-brief.md §2).

  This story does NOT decide `--onefile` vs `--onedir` upfront -- that choice is explicitly
  deferred to a spike within this story's own implementation step, per the epic's stated decision:
  build both, kill the running process and check whether the bound port actually frees (the
  PyInstaller-bootloader-PID gotcha research-brief.md §6 names -- `kill()` on a `--onefile` binary
  only has the bootloader process's PID, not the real Python/Flask process it execs, which can
  leave the port orphaned), and measure the REAL binary size for this project's actual dependency
  tree (not the brief's generic, explicitly-unverified 50-150MB estimate).

  The entrypoint calls `run_server(adapter, open_browser=False)` -- `src/cleanup_tools/ui/app.py`'s
  `run_server` (lines 45-79) already exposes `open_browser: bool = True` as a parameter, so no new
  CLI flag or forked code path is needed to suppress the "open a system browser tab" behavior; this
  is real, existing surface area design-discussion.md §2a calls out as "free."

  Three concrete gotchas budgeted real debugging time, all named in research-brief.md §2 and
  design-discussion.md §2a:
  1. Hidden-import/import-scanning breakage: `anthropic`/httpx/pydantic's import graph is the most
     likely source of "works from source, breaks in the frozen binary" bugs -- PyInstaller's static
     import scanner can miss dynamically-imported modules. Verified here by exercising EVERY route
     (including `/propose-ai`, which triggers the `anthropic`/httpx/pydantic import path) against
     the frozen binary directly, not a `pip list` review.
  2. Pillow's compiled deps (libjpeg/libpng bindings) must be present in the *build* environment
     per platform, not just importable at dev time -- this is a real per-platform-build-machine
     constraint, reinforcing why there is no single-machine cross-build for this piece.
  3. Templates/static files are data, not code: `src/cleanup_tools/ui/templates/*.html` and
     `static/keyboard.js` need explicit `datas=`/`--add-data` treatment in a spec file (never bare
     `--onefile`), or the frozen binary 404s/`TemplateNotFound`s on every route -- an easy thing to
     forget on a first pass, called out explicitly here so it isn't rediscovered by trial and error.

  This story has no hard dependency on flask-progress-reporting and can start immediately in
  parallel with it -- it freezes whatever `src/cleanup_tools/ui/` looks like at build time, and
  gets any /healthz route that story adds for free, without needing it to land first.

acceptance_criteria:
  - "Given a PyInstaller build is run against src/cleanup_tools/ui/ in BOTH --onefile and
    --onedir modes on the current development machine, when each resulting binary/directory is
    started as a subprocess, then both successfully bind and serve HTTP requests, and the
    onefile-vs-onedir DECISION section of this story's implementation records the measured, real
    binary/directory sizes for each (not a generic estimate)."
  - "Given the onefile-mode binary is started as a subprocess and its process is killed by its
    reported PID, when the bound port is checked afterward (via lsof/netstat, not just process-list
    inspection), then the actual observed behavior (port freed immediately / port stays bound /
    orphaned child process remains) is recorded as a concrete finding, and the same check is
    repeated for onedir mode -- this comparison is what the story's --onefile-vs-onedir DECISION is
    based on, not assumed from the research brief's description of the gotcha alone."
  - "Given the frozen binary (whichever mode is chosen) is started as a subprocess with
    open_browser=False behavior (no system browser window should appear), when every existing
    Flask route is exercised over HTTP against it -- GET /, GET /plan/sort, GET /plan/reclaim,
    POST /queue/<id>/approve, POST /queue/<id>/reject, POST /queue/<id>/undo, POST
    /queue/bulk-approve, POST /queue/bulk-reject, GET /queue, GET /thumbnail/<id>, POST
    /propose-ai (with a mocked/stubbed AI provider so this check needs no real API key) -- then
    every route responds with the SAME status code and equivalent body shape it returns when run
    from source (python -m cleanup_tools.ui / pytest's test_client()), with zero TemplateNotFound,
    zero import errors, zero 404s caused by missing static/template files."
  - "Given the frozen binary's build log/spec file is inspected, when checked for the templates/
    and static/ directories, then both are present via explicit datas= entries (or --add-data
    flags) in the spec, not omitted in reliance on bare --onefile packaging."
  - "Given the build is attempted on a machine lacking Pillow's compiled libjpeg/libpng
    dependencies in the BUILD environment (or this is verified by documentation/CI config review
    if a real second machine isn't available), when documented, then the story's implementation
    notes explicitly call out that Pillow's compiled deps must be present at BUILD time per
    platform, separate from the interpreter used to develop the rest of the project."
  - "Verify via: a smoke-test script (not pytest, since this drives a real subprocess binary, not
    Flask's test_client()) that starts the frozen binary, polls until it accepts connections,
    exercises every route above, and asserts on response status/shape -- runnable as
    `python scripts/smoke_test_sidecar.py <path-to-binary>` or equivalent, with its pass/fail
    output captured as this story's primary automated verification."

steps:
  - id: research
    description: |
      Research via research-brief.md §2 (already answers the PyInstaller-vs-Nuitka-vs-bundled-
      runtime question -- do not re-litigate) plus targeted web lookups of CURRENT PyInstaller
      docs for: spec-file datas= syntax, the --onefile/--onedir CLI flags, and any documented
      caveats for Flask/anthropic/Pillow-shaped dependency trees specifically (PyInstaller's own
      hooks system for httpx/pydantic, if any exist, since these are common enough libraries that
      community hooks may already solve the hidden-import problem). Also read
      src/cleanup_tools/ui/app.py's run_server signature (lines 45-79) and routes.py's full route
      list (grep for @bp.route) to build the exact list of routes the smoke test must exercise.
      There is no internal codebase precedent for this (first PyInstaller build this project has
      ever had) -- cite research-brief.md and current PyInstaller docs, not internal files.
    agent: researcher
  - id: implement
    description: |
      Create a PyInstaller spec file (e.g. packaging/pyinstaller/cleanup_ui.spec) with an
      entrypoint script calling run_server(adapter, open_browser=False) with a fixed or
      env-var-configurable port, explicit datas= entries for src/cleanup_tools/ui/templates/*.html
      and src/cleanup_tools/ui/static/*, and hiddenimports entries for anything the research step's
      hidden-import investigation surfaces as needed. Build BOTH --onefile and --onedir variants.
      Run the kill+verify-port-freed check for each (start, curl a route, note the PID, kill it,
      check lsof/netstat for the port). Measure and record real binary/directory sizes (du -sh).
      Record the onefile-vs-onedir DECISION explicitly in this story's own notes/PR description,
      with the measured evidence, not just a restated preference.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Write scripts/smoke_test_sidecar.py (or tests/test_sidecar_smoke.py gated to run only when a
      built binary path is supplied, e.g. via an env var or pytest marker, since this cannot run in
      a plain `pytest` invocation without a pre-built binary): starts the frozen binary as a
      subprocess, polls a connect-and-respond check until ready (with a timeout), exercises every
      route named in the acceptance criteria (mocking/stubbing the AI provider for /propose-ai so
      no real API key or network call is needed), asserts status codes and body shapes match the
      source-run equivalents, then terminates the subprocess and asserts the port frees within a
      reasonable timeout for the CHOSEN (onefile or onedir) mode.
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Review specifically: does the spec file's datas= list actually cover every template/static
      file the app serves (cross-check against a real `find src/cleanup_tools/ui/templates
      src/cleanup_tools/ui/static` listing, not just trust the spec author's memory)? Was
      /propose-ai's route genuinely exercised against the frozen binary (not skipped as "too hard
      to test"), given it's specifically named as the most likely import-scanning breakage point?
      Is the onefile-vs-onedir DECISION backed by the actual measured kill+port-freed evidence
      recorded in the implementation step, not just restated from the research brief's description
      of the general gotcha?
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

