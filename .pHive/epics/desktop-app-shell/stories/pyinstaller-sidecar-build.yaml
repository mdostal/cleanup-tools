code_examples:
  - title: "run_server's open_browser parameter -- already exists, the sidecar entrypoint uses it as-is"
    file: src/cleanup_tools/ui/app.py
    snippet: |
      def run_server(
          adapter: OSAdapter,
          queue_path: Path | None = None,
          host: str = LOCALHOST,
          port: int = DEFAULT_PORT,
          open_browser: bool = True,
      ) -> dict:
          ...
          if open_browser:
              webbrowser.open(f"http://{host}:{port}/")
          app.run(host=host, port=port, debug=False, use_reloader=False)
          return {"host": host, "port": port}
  - title: "The AI-provider route whose import graph is the named highest-risk hidden-import surface"
    file: src/cleanup_tools/ui/routes.py
    snippet: |
      from ..ai import CredentialsError, get_provider
      from ..ai.wiring import DEFAULT_CAP as DEFAULT_AI_CAP
      from ..ai.wiring import propose_for_other_bucket

