          adapter = _adapter()
          try:
              provider = get_provider()
          except CredentialsError as exc:
              return redirect(url_for("ui.dashboard", plan_error=str(exc)))
          ...

design_decisions:
  - decision: "The --onefile vs --onedir choice is decided IN this story, via a real spike, not assumed before it starts"
    rationale: "Task brief decision 1 / design-discussion.md Open Question 4: the tradeoff (onefile's distribution simplicity vs. its bootloader-PID kill gotcha, onedir's more-reliable signal forwarding vs. shipping a directory of files) genuinely affects downstream Tauri-shell crash/quit design (research-brief.md §6), so it needs real evidence from THIS project's actual build, not a guess carried in from research"
  - decision: "Verification is a real subprocess-driven smoke test against the frozen binary, not a pip-list/import-review of the spec file"
    rationale: "research-brief.md §2 and design-discussion.md §2a both explicitly warn that hidden-import breakage is the most likely 'works from source, breaks in the frozen binary' failure mode -- a static review of the spec file cannot catch a route that 500s at runtime because PyInstaller's scanner missed a dynamically-imported module"
  - decision: "Entrypoint reuses run_server(adapter, open_browser=False) as-is rather than writing a new sidecar-specific server-start function"
    rationale: "design-discussion.md §2a: this parameter already exists and does exactly what the sidecar needs (suppress the system-browser-open behavior); adding a second code path here would be needless duplication"

risks:
  - severity: high
    description: "PyInstaller's import scanner misses a dynamically-imported module in anthropic/httpx/pydantic's dependency graph, causing /propose-ai to 500 only in the frozen binary, never caught by source-run tests"
    mitigation: "The smoke test explicitly exercises /propose-ai against the real frozen binary (with a stubbed provider to avoid needing a real API key), not just the routes that were already known to work from source"
  - severity: high
    description: "Templates/static files omitted from datas=, causing every route to 404/TemplateNotFound in the frozen binary despite the source-run app working fine"
    mitigation: "The review step explicitly cross-checks the spec's datas= list against a real directory listing of templates/ and static/, and the smoke test's route-by-route check would fail loudly on this -- described as an easy-to-forget, loud-failure risk in design-discussion.md §2a, not a subtle one"
  - severity: medium
    description: "Pillow's compiled libjpeg/libpng bindings are missing from a build machine, producing a binary that fails at import time for image-handling routes only"
    mitigation: "Documented explicitly as a per-platform build-environment requirement (not a runtime requirement), separate from whatever Python environment is used for day-to-day development"
  - severity: medium
    description: "Real measured binary size turns out much larger than the research brief's 50-150MB estimate, with downstream implications for .dmg size and the Arch PKGBUILD's local build/fetch time"
    mitigation: "This story's acceptance criteria require the REAL measured size to be recorded, explicitly not the brief's generic estimate -- surfaces the number early enough for the macOS/Arch packaging stories to plan around it rather than discovering it late"

