code_examples:
  - title: "Existing synchronous reclaim-plan staging this story wraps in a background job (unchanged internals)"
    file: src/cleanup_tools/ui/routes.py
    snippet: |
      def _stage_reclaim_plan(adapter) -> list[queue_module.QueueEntry]:
          result = reclaim_module.run(adapter, args=None)
          new_entries = []
          for category_name, category in result.get("categories", {}).items():
              for item in category.get("entries", []):
                  if item.get("master_path_refused"):
                      continue
                  new_entries.append(
                      queue_module.QueueEntry(
                          action="delete",
                          src=str(item["path"]),
                          ...
                      )
                  )
          return queue_module.stage_entries(adapter, new_entries, _queue_path())

      @bp.route("/plan/reclaim")
      def plan_reclaim():
          adapter = _adapter()
          try:
              added = _stage_reclaim_plan(adapter)
          except TimeoutError:
              return redirect(url_for("ui.dashboard", plan_error=QUEUE_BUSY_MESSAGE))
          return redirect(url_for("ui.dashboard", staged=len(added)))
  - title: "The du-shelling call whose per-candidate iteration is the natural progress-reporting hook"
    file: src/cleanup_tools/adapters/base.py
    snippet: |
      def dir_size_bytes(self, path: Path) -> int:
          """Return the recursive size of ``path`` in bytes, via ``du -sk``."""
          result = subprocess.run(
              ["du", "-sk", str(path)],
              stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL,
              text=True,
          )
          ...
  - title: "run_server's current bare app.run() call -- threaded=True is added here"
    file: src/cleanup_tools/ui/app.py
    snippet: |
      app.run(host=host, port=port, debug=False, use_reloader=False)
      return {"host": host, "port": port}

design_decisions:
  - decision: "Background thread + job-id + polling /status/<job_id>, not Server-Sent Events"
    rationale: "design-discussion §2c: SSE needs a long-lived streaming connection, a meaningfully bigger lift on a single-threaded Werkzeug dev server, for a problem plain polling solves adequately at this scale (one user, one job at a time)"
  - decision: "jobs.py's registry is in-memory only, deliberately never persisted to disk"
    rationale: "A job only matters for the life of one open app window/browser tab -- unlike queue.yaml (which must survive process restarts and be safe for concurrent CLI+UI access), a job registry losing state on restart is an acceptable, even correct, tradeoff (design-discussion §2c)"
  - decision: "/healthz is a brand-new route, not a repurposing of GET /"
    rationale: "None of the existing routes are cheap enough for a readiness-poll loop -- GET / does real queue-loading/grouping work (routes.py:172-182); the Tauri shell (and any future automated health monitoring) needs a route that is cheap by construction, not by accident"
  - decision: "Only /plan/reclaim gets the job-runner treatment in this story; /plan/sort and a future survey route do not"
    rationale: "reclaim.py's dir_size_bytes du-shelling is the concrete, current slow path with a real UI route calling it today; survey has the same shape but no UI route calls it yet, so there is nothing to fix there right now -- the job-runner helper is written reusably (not hardcoded to reclaim specifically) so a future route isn't a second bespoke implementation, but no second route is added in this epic"

risks:
  - severity: medium
    description: "A background thread's exception could leave a job registry entry stuck at 'running' forever if not caught"
    mitigation: "The job runner wraps the target call in try/except and always writes a terminal status (done or error) in a finally-equivalent path; explicitly tested in test_jobs.py/test_ui_routes.py by mocking a raising target"
  - severity: low
    description: "threaded=True could interact badly with the existing queue file-locking (queue.py's with_queue_lock/fcntl.flock) if two requests race on the SAME queue mutation"
    mitigation: "with_queue_lock's existing lock (already designed for concurrent CLI+UI access, per ai-approvals-ui epic) is untouched by this story -- threaded=True only changes how many requests Werkzeug's dev server can be mid-handling of simultaneously, not how the queue file itself is protected"
  - severity: low
    description: "/healthz being 'too cheap' could mean it doesn't actually prove the app is ready to serve real requests (e.g. Flask started but a route module failed to import)"
    mitigation: "/healthz only needs to prove the Flask process is up and its blueprint is registered -- a Tauri shell polling it before navigating to the real UI is checking 'is there a server here to navigate to', not 'is every route fully functional', which is a deliberately narrow and sufficient readiness bar per research-brief.md §6"

references:
  - path: .pHive/epics/desktop-app-shell/docs/design-discussion.md
    relevant_excerpt: |
      Proposed shape: background thread + job-id + polling `/status/<job_id>`, not Server-Sent
      Events... A new small module (e.g. `src/cleanup_tools/ui/jobs.py`) holding an in-memory,
      lock-guarded `dict[job_id, JobState]`, deliberately **not** persisted to disk... `app.run(...,
      threaded=True)` needs to be added alongside this -- today's `run_server` doesn't set it,
      which is fine for one-request-at-a-time browser use but would make `/status` polls queue up
      behind whatever else is in flight once a job is running.
  - path: .pHive/epics/desktop-app-shell/docs/research-brief.md
    relevant_excerpt: |
      A native app window that just sits there for 2 minutes with no feedback reads as **broken**...
      the Flask backend's long-running endpoints (survey, reclaim) need **some** progress-reporting
      mechanism the Tauri webview can render -- e.g. Server-Sent Events or long-polling from the
      existing Flask process, or a simple "job started / poll /status" pattern.

cross_cutting:
  - concern: documentation
    action: "README.md's Status section should note that `cleanup approve`'s reclaim-plan trigger now reports progress instead of hanging silently. .pHive/CONTEXT.md's Key paths section should add a short entry for the new job registry (src/cleanup_tools/ui/jobs.py) alongside its existing approval_queue.yaml entry, noting explicitly that job state is in-memory and does NOT persist like the queue does."
