design_decisions:
  - decision: "depends_on: [pyinstaller-sidecar-build] as a hard story dependency, with explicit prose in this story's description explaining that early scaffolding (window/loading-screen/capabilities) can still start against a manual stand-in"
    rationale: "Full verification of this story's crash/quit acceptance criteria genuinely needs the real PyInstaller binary's bootloader-PID behavior, which cannot be tested against a stand-in -- making the dependency formal and checkable is more honest than depends_on: [] with only a soft prose note a scheduler could ignore"
  - decision: "Crash/quit handling is hand-rolled in this story's own Rust code, not borrowed from an official Tauri primitive"
    rationale: "research-brief.md §6 confirms no polished official Tauri primitive exists yet for this (the relevant plugin proposal, plugins-workspace#3062, is open, not merged) -- this project has to build its own sidecar-exit-event listener and shutdown-signal logic"
  - decision: "No tauri-plugin-updater, no analytics/telemetry/crash-reporting plugin, verified by grepping the actual lockfiles once they exist"
    rationale: "Preserves this project's existing 'no ambient network calls / no telemetry' hard rule (.pHive/CONTEXT.md Conventions) into the Tauri layer -- research-brief.md §7 treats Tauri's own telemetry posture as 'not found to be a problem' rather than 'confirmed clean', so this story does the actual lockfile-level verification the research pass flagged as still needed"
  - decision: "Unsigned macOS build, relying on right-click-Open, per decision 6 -- not re-litigated here"
    rationale: "This is a personal tool being installed on the owner's own machine(s), not distributed to strangers; signing/notarization stays a clearly-flagged future story (config/secrets problem, not architecture)"

risks:
  - severity: high
    description: "First-ever Rust/Tauri code in this project, no internal precedent -- genuinely new toolchain risk that no prior epic's story-writing conventions were built to anticipate"
    mitigation: "Research step explicitly cites external prior art (dieharders' example repos, zudo-tauri-wisdom docs) rather than pretending internal precedent exists; this is also why this story's complexity is rated high and it is scoped as its own story rather than folded into a smaller one"
  - severity: high
    description: "PyInstaller-bootloader-PID kill gotcha causes an orphaned Flask process/bound port after app quit, undiscovered until a real user notices port 5151 is stuck bound"
    mitigation: "This story's crash/quit acceptance criteria are explicitly gated on testing against the REAL frozen binary (not a stand-in), applying whichever mitigation pyinstaller-sidecar-build's spike determined works (onedir's more-reliable signal forwarding, and/or Flask handling SIGTERM cleanly, and/or a process-group kill from the Rust side)"
  - severity: medium
    description: "Port-collision detection races: the Tauri app's /healthz check happens right as a terminal-launched `cleanup approve` is mid-startup, neither cleanly 'not there' nor 'ready'"
    mitigation: "The healthz check treats any non-2xx/connection-refused response as 'not running yet, safe to spawn' and the manual verification pass explicitly exercises the 'already running' case, though a true simultaneous-startup race is flagged as a known edge case not exhaustively tested at this scope"
  - severity: medium
    description: "Capabilities scoped too broadly (e.g. shell:allow-execute without a name-scoped constraint), granting the sidecar more permission than it needs"
    mitigation: "Explicit review-step check of capabilities/default.json against the research brief's minimal example (research-brief.md §1), not just 'it works so it must be scoped right'"

references:
  - path: .pHive/epics/desktop-app-shell/docs/research-brief.md
    relevant_excerpt: |
      **Do not block Tauri's `setup()` hook waiting for the sidecar to become ready.** Multiple
      sources independently flag this as *the* common mistake... **Recommended pattern**: create
      the webview window immediately with a lightweight local loading screen... spawn the sidecar
      in the background, and have the *frontend* poll/await the sidecar's readiness... If the
      sidecar binary is a **PyInstaller `--onefile`** executable, Tauri (and `kill()`) only has the
      PID of the PyInstaller *bootloader* process, not the real Python process it bootstraps and
      execs -- naively killing the bootloader PID can leave the actual Flask process... alive as an
      orphan.
  - path: .pHive/epics/desktop-app-shell/docs/design-discussion.md
    relevant_excerpt: |
      Worth deciding at story-write time whether the desktop app should (a) detect the port's
      already bound and just navigate its webview to the existing instance instead of trying to
      spawn its own sidecar, (b) fail with a clear "already running" message, or (c) pick a
      different port for the packaged app -- this is a new failure mode that simply didn't exist
      when there was only ever one way to start the Flask process. [Resolved: (a), per the epic
      task brief's decision 3.]

cross_cutting:
  - concern: documentation
    action: "README.md needs a new section describing how to build/run the desktop app (tauri dev / tauri build) alongside the existing `cleanup approve` browser-based instructions, explicitly noting both remain independent, coexisting ways to reach the same UI. .pHive/CONTEXT.md's Key paths section should add entries for src-tauri/ and the loading-screen frontend asset, and its Conventions section should note the 'no tauri-plugin-updater / no telemetry plugin' rule alongside the existing no-ambient-network-calls rule."
