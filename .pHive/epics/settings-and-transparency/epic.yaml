name: settings-and-transparency
title: Gear-icon settings shell, full config CRUD, advanced view, and a real history/undo view
description: |
  Grows Settings from a single icon-picker page into a real settings surface: every
  Config field editable, a dedicated gear-icon entry point, progressive-disclosure
  Advanced view, and a History view that answers "we need more transparency" with a
  genuine per-item audit trail -- a real differentiator, since the closest commercial
  competitor (CleanMyMac) has no exportable log or scan history at all.
