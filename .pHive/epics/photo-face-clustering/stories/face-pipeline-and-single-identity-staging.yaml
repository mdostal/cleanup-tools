id: face-pipeline-and-single-identity-staging
epic: photo-face-clustering
title: Reuse phase-1 walk + single-identity-only staging rule + by-person/ dest convention
status: done
complexity: high
methodology: classic
depends_on: [face-index-and-clustering]

description: |
  Wires detection/embedding (face-detection-and-embedding) and index/clustering
  (face-index-and-clustering) together, reusing `document-topic-clustering`'s ALREADY-BUILT
  recursive-scan + protected-path + iCloud-guard walk from `semantic/pipeline.py`
  (parameterized by extractor: text vs. face) rather than a second parallel
  implementation (this epic's own grill finding C1).

  The central new rule, resolving this epic's core design tension (design discussion §5):
  a move proposal is staged for a photo ONLY when every detected face in it maps to the
  SAME person-cluster. Group/multi-person photos are detected, embedded, and indexed
  (forward-compatible groundwork for a future multi-membership epic) but NEVER staged --
  action="move" can only place a file in one destination, and this epic does not invent a
  new "tag, don't move" QueueEntry action type to work around that. Destination is
  domain-separated: `<location>/_clusters/by-person/<slug>/`, distinct from phase 1's
  `_clusters/by-topic/<slug>/` (grill T1), so a human browsing the result sees two clearly
  separated kinds of grouping.

acceptance_criteria:
  - "Given a folder of photos, when the pipeline scans it, then it reuses semantic/pipeline.py's existing recursive-scan/protected-path/iCloud-guard walk -- not a second, separately-implemented walk."
  - "Given a photo where every detected face maps to the same person-cluster, when the pipeline runs, then a real QueueEntry (action=move, dest under _clusters/by-person/<slug>/, group_key=f'cluster:{location}:{slug}', source=local:cluster) is staged."
  - "Given a photo with 2+ detected faces mapping to DIFFERENT person-clusters, when the pipeline runs, then NO move is staged for that photo -- it is indexed (both faces' embeddings are stored) but never proposed."
  - "Given a photo with zero detected faces, when the pipeline runs, then it is skipped entirely for this pipeline (not proposed, not an error)."
  - "Given cluster-sourced photo entries and document entries in the same queue, when queue.parse_group_key/group_entries_hierarchical process them, then both use the shared 'cluster' pipeline prefix but land under visually distinct by-person/ vs by-topic/ destinations."

steps:
  - id: research
    description: Re-confirm semantic/pipeline.py's exact walk interface (from phase 1's implementation, once it exists) to extend it with a face-extractor parameter rather than duplicating the walk logic.
    agent: researcher
  - id: implement
    description: |
      Extend src/cleanup_tools/semantic/pipeline.py to support a face-extraction mode
      (reusing the existing walk), implement the single-identity staging rule and the
      by-person/ dest convention.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Real fixture folders with single-face photos, multi-face/multi-identity photos, and
      zero-face photos, plus a monkeypatched face detector (avoiding real onnxruntime calls
      in this story's own tests -- face-detection-and-embedding's story already covers
      real-model testing). Dedicated tests for the single-identity staging rule and the
      by-person/by-topic dest separation, independently.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Specifically verify no code path can stage a multi-identity photo as a move under any circumstance -- this is the story's core safety property, mirroring this session's established "review step specifically checks for the one regression that must never ship" discipline.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

