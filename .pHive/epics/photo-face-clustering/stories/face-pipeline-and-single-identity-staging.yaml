design_decisions:
  - decision: A move is staged only when every face in a photo maps to the same cluster; multi-person photos are indexed but never staged.
    rationale: "Keeps action=move semantics 100% consistent with every other pipeline in this codebase rather than inventing a new QueueEntry action type. A zero-copy 'tag, don't move' alternative (Finder tags/xattr, per the research brief §2.4) is explicitly deferred to a later epic. Design discussion §5."
  - decision: by-person/ and by-topic/ are separate subdirectories under _clusters/.
    rationale: "Grill T1 -- avoids mixing two conceptually different kinds of grouping in one flat namespace, and makes slug collision between the two epics structurally impossible."

risks:
  - severity: high
    description: A bug in the single-identity check could stage a multi-person photo as a move, misrepresenting a group photo as belonging to one person.
    mitigation: Dedicated adversarial test + explicit review-step callout, mirroring chat-propose-and-approve's own guard-regression discipline from an earlier epic this session.

