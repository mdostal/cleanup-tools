files_to_modify:
  - file: src/cleanup_tools/semantic/faces.py
    change: New -- detect_faces(path) -> list[FaceDetection].
  - file: pyproject.toml
    change: Add onnxruntime + insightface-adjacent packages to the `semantic` extras group (see face-packaging-and-verification for the full packaging story; this story only needs the group to exist for local dev installs).

design_decisions:
  - decision: Model weights are vendored static files, loaded via onnxruntime.InferenceSession directly, never through insightface's own FaceAnalysis convenience wrapper.
    rationale: "insightface's default loading path auto-downloads from a remote model zoo on first use -- the exact class of gotcha the research brief flags for HF_HUB_OFFLINE, just a different package. Design discussion §2.1."
  - decision: This capability is cross-platform (Mac + Arch) from day one, unlike phase 1's Mac-only text embedder.
    rationale: "There is no local-native, zero-cost alternative to InsightFace on ANY platform (Apple's Vision framework doesn't expose a public identity-embedding API) -- so there's no cheaper Mac-only path to prefer over a cross-platform one here. Design discussion §2."

risks:
  - severity: high
    description: onnxruntime + InsightFace model files might not run correctly, or the CoreML execution provider might not engage, in this specific environment.
    mitigation: The research step's spike runs before any implementation code, specifically to surface this early.
  - severity: high
    description: insightface's package internals might reach the network in a code path not obvious from its public API (e.g. a version-check, a telemetry call) even when the model-zoo downloader itself is bypassed.
    mitigation: The block_real_network-style test is the concrete guard against this, not just an assumption that avoiding FaceAnalysis is sufficient.

references:
  - path: .pHive/epics/photo-face-clustering/docs/design-discussion.md
    relevant_excerpt: |
      §2.1: this epic's implementation must NOT rely on insightface's own convenience
      auto-download: model weights are vendored as static files... the ONNX Runtime session
      is constructed directly from those local files, never through insightface's
      high-level auto-downloading wrapper.

